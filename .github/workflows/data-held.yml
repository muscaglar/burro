name: data-held

# Says whether the store holds every file that this repository holds a receipt for.
# For the founder: docs/data-builds.md says how to start it and how to read it.
#
# It fetches nothing and writes nothing to the store. Its one step that is given the
# key lists what the store holds, and holds the listing to the receipts that are
# committed. No file is copied out of the store, and no publisher is asked for anything.
#
# It is started by hand, on the default branch, and the check waits for approval.
# It prints step names, registry ids, the names the lists of this repository give a
# list and a file of one, counts and the ids of files, and uploads nothing to GitHub.
# tools/check_data_workflows.py holds this file to its rules: in `make ci`, and
# again as the first step of every run.

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: data-held
  cancel-in-progress: false

jobs:
  # Needs no secret and no approval, so a mistake is found before anyone is asked.
  check:
    name: Rules and canary
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17"
          enable-cache: false
      - name: The run is on the default branch, and the workflows keep their rules
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: uv run --no-project python tools/check_data_workflows.py --on-default-branch
      - name: No file names a private package host or holds credentials
        run: uv run --no-project python tools/check_public_only.py
      # Only what a step imports, and nothing published after the day stated. No lockfile
      # yet, so no --locked. docs/data-builds.md says how the day is moved.
      - name: Install
        run: uv sync --package burro-pipeline --no-dev --exclude-newer 2026-09-23T00:00:00Z
      - name: A planted row and a planted key cannot be seen
        run: uv run --no-sync python tools/canary.py plant

  # The key of this environment may read the store and list it, and no more.
  held:
    name: What the store holds
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: data-held
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17"
          enable-cache: false
      - name: Install
        run: uv sync --package burro-pipeline --no-dev --exclude-newer 2026-09-23T00:00:00Z
      - name: Every secret is set, and what is made from one is hidden
        env:
          BURRO_STORE_ENDPOINT: ${{ secrets.BURRO_STORE_ENDPOINT }}
          BURRO_STORE_BUCKET: ${{ secrets.BURRO_STORE_BUCKET }}
          BURRO_STORE_KEY_ID: ${{ secrets.BURRO_STORE_KEY_ID }}
          BURRO_STORE_SECRET: ${{ secrets.BURRO_STORE_SECRET }}
        run: uv run --no-project python tools/public_log.py mask
      # One line for each list, one for each file that is missing or differs, and one of
      # totals. The step fails where a file that has a receipt is not in the store.
      - name: The store holds every file that has a receipt
        env:
          BURRO_STORE_ENDPOINT: ${{ secrets.BURRO_STORE_ENDPOINT }}
          BURRO_STORE_BUCKET: ${{ secrets.BURRO_STORE_BUCKET }}
          BURRO_STORE_KEY_ID: ${{ secrets.BURRO_STORE_KEY_ID }}
          BURRO_STORE_SECRET: ${{ secrets.BURRO_STORE_SECRET }}
        run: uv run --no-project python tools/public_log.py --step store -- uv run --no-sync python -m burro_pipeline held --receipts data/receipts

  # Runs whatever happened before it: a step that failed is where a row would get out.
  search:
    name: Search what the run made public
    needs: [check, held]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17"
          enable-cache: false
      - name: No log holds a planted row or key, and nothing was uploaded
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run --no-project python tools/canary.py search
