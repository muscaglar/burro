<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- The head of Burro the rabbit as burro-sits draws it, on a ground of meadow. Rectangles on a
       grid of sixteen, laid one over another: his outline, his fur, what is lit, shaded and pale,
       and his eye last. test/icon.test.ts holds it to the drawing, square for square. -->
  <title>Burro</title>
  <rect fill="#a8d85e" width="16" height="16"/>
  <g fill="#2a2140">
    <rect x="4" y="0" width="2" height="14"/>
    <rect x="3" y="1" width="4" height="4"/>
    <rect x="8" y="1" width="2" height="15"/>
    <rect x="4" y="2" width="7" height="12"/>
    <rect x="3" y="8" width="9" height="5"/>
    <rect x="2" y="9" width="11" height="2"/>
    <rect x="3" y="9" width="10" height="4"/>
    <rect x="13" y="11" width="1" height="2"/>
    <rect x="11" y="13" width="2" height="1"/>
    <rect x="5" y="14" width="7" height="1"/>
    <rect x="7" y="15" width="3" height="1"/>
  </g>
  <g fill="#9b8a7f">
    <rect x="4" y="2" width="2" height="3"/>
    <rect x="4" y="3" width="6" height="2"/>
    <rect x="5" y="5" width="5" height="9"/>
    <rect x="10" y="9" width="2" height="5"/>
    <rect x="4" y="10" width="8" height="3"/>
    <rect x="7" y="14" width="3" height="1"/>
  </g>
  <g fill="#e9cf94">
    <rect x="4" y="1" width="2" height="1"/>
    <rect x="5" y="1" width="1" height="4"/>
    <rect x="8" y="2" width="2" height="1"/>
    <rect x="9" y="2" width="1" height="6"/>
    <rect x="6" y="3" width="1" height="5"/>
    <rect x="3" y="9" width="3" height="1"/>
    <rect x="7" y="9" width="3" height="1"/>
    <rect x="9" y="9" width="1" height="4"/>
    <rect x="3" y="10" width="1" height="1"/>
    <rect x="7" y="10" width="1" height="2"/>
    <rect x="8" y="12" width="2" height="1"/>
  </g>
  <rect fill="#65566a" x="12" y="11" width="1" height="1"/>
  <g fill="#f7f1de">
    <rect x="11" y="12" width="2" height="1"/>
    <rect x="10" y="13" width="2" height="1"/>
