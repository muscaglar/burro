[project]
name = "burro-core"
version = "0.0.0"
description = "Burro's ranking engine: the preference spec, the reducer, rank(), facts and the verifier. Pure Python, no IO."
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/burro_core"]
