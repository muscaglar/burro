# The table of tiers: which chain of grocers, of gyms and of coffee is premium, which is
# mid-range and which is value.
#
# It is the founder's opinion, decided on 2026-09-24 (docs/adr/0026), and it is the
# founder's to adjust. So it is data, and no line of code says which chain is of which
# tier: to move a chain, change its `tier` here and build again. A tier says what a chain
# charges and how it presents itself. It says nothing of who shops there.
#
# | | Premium | Mid | Value |
# |---|---|---|---|
# | Grocers | Waitrose, M&S, Whole Foods | Sainsbury's, Tesco, Co-op | Asda, Aldi, Lidl, Iceland |
# | Gyms | Equinox, Third Space, Barry's | Virgin Active, Nuffield, Gymbox | PureGym, The Gym Group |
# | Coffee | Gail's, Ole & Steen | Pret, Nero, Starbucks | Greggs |
#
# Five chains were added beside their neighbours, and each says so with
# `on_the_founders_table = false`: Morrisons, David Lloyd, Anytime Fitness, Costa and
# Blank Street. Each is a first guess, and the founder's to move or to take out.
#
# What each row holds:
#   key        The name of the chain in an id. Core names the distance to the nearest place
#              of a chain `brand_<key>`, so a chain is asked for by name only where core
#              holds that id. A chain that core does not name is still counted in its tier.
#   name       The chain as Burro says it, which is as the founder's table writes it.
#   kind       `grocer`, `gym` or `coffee`. A place counts only where the file also gives
#              it a category of that kind: a bank, a pharmacy or a petrol station of a
#              chain of grocers is no grocer. `derive/brand_table.py` holds the categories.
#   tier       `premium`, `mid` or `value`.
#   wikidata   The ids an encyclopaedia gives the chain, as the file gives them beside a
#              spelling below. It is the surest key, and the file gives it for few places.
#   spellings  Every way the file writes the chain, letter for letter. A place is of the
#              chain where its brand has one of the ids, or gives no id of any row and is
#              written one of these ways. The file takes some spellings from the name of a
#              page a chain keeps elsewhere, so a spelling may name another town or country:
#              it is kept as it is written, because it is how the file writes a London place.
#
# The ids and the spellings were read in London's part of release 2026-09-23.0 of Overture
# Maps Places, on 2026-09-24, by a program. No person has read them against the file. They
# are to be read again for every release that is pinned: a spelling that is missing leaves
# places uncounted, and nothing warns of it.
#
# The part gives no place the brand of Third Space or of Gymbox, so neither has a spelling
# and neither is counted. Each stays on the table, for the day the file holds it.
schema_version = 1
read_in = "overture-places 2026-09-23.0"

