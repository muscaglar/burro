# The files of the first real build: milestone M1 of docs/design/london-data.md.
# Five measures for all of London, on official census areas.
#
# Every file here was fetched on 2026-09-23, and its receipt is in
# data/receipts. Every `page` is the registry entry's own: its `url`, or an
# address under its `evidence_urls`. Every `url` was read on a publisher's page
# on 2026-09-23, through a reader that extracts the text of a page. An
# extraction is not the page. So no person has seen an address here. No address
# was guessed, and none was built from a pattern. Each file's notes say where
# its address was read.
#
#   Sure of: voa-ctsop-1-1, voa-ctsop-3-1, voa-ctsop-4-1 and iod-file-8. Each
#   address is written whole on the entry's own page. The reader was asked
#   twice, in different words, and gave the same address letter for letter.
#   The page itself may have been fetched only once.
#
#   To open once in a browser before the first fetch: the other seven. Each has
#   "url" under `unsure`, and its notes say why. Five are on the portal of the
#   statistics office, which may send a download on to another host. If it
#   does, name that host under `may_redirect_to`. One was read on a page that
#   the registry entry does not hold. One was written on its page as a path,
#   and not as a whole address.
#
# When a fetch has taken a file from its address, take "url" out of `unsure`.
# A file that a publisher will not give to a program is saved in a browser and
# handed over with the step `by-hand`.
#
# `url_parameters` names the parameters that are part of a file's address. An
# address holds no other, and no other is written in a receipt.
#
# `unsure` names what nobody has checked. A size under `max_bytes` that is
# unsure is a guess, set well above what the file is thought to be. An edition
# or a period that is unsure, or missing, stops the receipt from being written:
# the file is stored, and the step `describe` shows its shape, but nothing
# can be cited to it until a person has stated both.
#
# Each edition and each period below was first read on a publisher's page.
# Every file has since been fetched, and a program has read each one:
# docs/research/data/m1-files.md says what each holds. The steps of the first
# build read ten of them, and the full-resolution boundaries are read by no
# step. No person has read one. So no file names "edition" or "data_period"
# under `unsure`, and each has its receipt. A file that is added here names
# both under `unsure` until it has been read, and its first fetch stores it and
# writes no receipt. When a person has read a file, and found its edition and
# its period in it, both are taken out of `unsure` in a commit, and the next
# fetch writes the receipt. docs/data-builds.md, section 7, says how, and how a
# receipt that is wrong is put right.
#
# `uv run python -m burro_pipeline plan --list m1 --words` says what each file
# still needs. Each step's own --help says how to run it.
#
# Not listed: ons-msoa-2021. The preview of the first build is drawn on MSOAs,
# and ADR 0016 does not choose whether their outlines are read from that file
# or made by joining output areas. Add it here when that is chosen.
schema_version = 1
build = "m1"

[[file]]
item = "oa-lookup"
source_id = "ons-oa21-lsoa21-msoa21-lad22-lookup"
use = "scoring"
what = "Output area to LSOA to MSOA to local authority, best-fit lookup, England, V2"
format = "csv"
page = "https://www.data.gov.uk/dataset/c2235117-cbfd-480d-8fc7-b564bd0f4d58/output-area-2021-to-lsoa-to-msoa-to-lep-to-lad-december-2022-best-fit-lookup-in-en-v2"
url = "https://open-geography-portalx-ons.hub.arcgis.com/api/download/v1/items/45fdd4465604493cb7d2238ad642172b/csv?layers=0"
# The portal hands a download on to the hosts that hold the file. Seen on 2026-09-23.
may_redirect_to = ["services1.arcgis.com", "stg-arcgisazurecdataprod1.az.arcgis.com"]
url_parameters = ["layers"]
max_bytes = 100_000_000
edition = "V2"
data_period = { as_at = "2022-12" }
unsure = ["url", "format", "max_bytes"]
notes = "Address read on 2026-09-23, on the page above, through a reader that extracts. The page lists it as CSV. The item named in the address is the one the registry entry holds. Open it once in a browser: from memory, the portal makes a file when it is asked for, and may send the download on to another host, or answer that the file is not ready. The page gives no size. The hosted table is 65,355,776 bytes, as its item record says, which is not the download. The registry entry's own address is a table behind a map service, which answers in pages of rows and lists no file. About 179,000 rows for England, from memory. Count the London rows against 26,369 before use."

