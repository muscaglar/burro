notes = "Address read on 2026-09-23, on the page above, through a reader that extracts. The reader was asked twice, in different words, and gave the same address both times. The page writes it as a name beside the page, greater-london-latest.osm.pbf, and the address here is that name worked out against the page's own address, as a browser does. Open it once in a browser. The page gives 123 MB. The edition is the time the publisher says the file holds data up to. The file is replaced about daily under the same address. So the list states no edition, and says where the file states its own: fetch reads the time in the header block of what arrives, and writes the receipt from it. The period is the day of that time. It was read on 2026-09-24 in the file kept in the store on 2026-09-23, f-8b4ac76b6f23: its header block gives 2026-09-22T20:22:59Z as the time its data runs to, which is what the page said on 2026-09-23, and the publisher's name for the file holds the same day, as 260922. If that file arrives again, its edition is 2026-09-22T20:22:59Z. For London only. Whether the extract reaches a few kilometres past London's edge, as the registry asks, is not known. For routing only: it never enters the gazetteer, the cells or a score."

