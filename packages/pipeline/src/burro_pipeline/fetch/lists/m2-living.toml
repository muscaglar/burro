# Homes, journeys, schools and safety: the files of milestones M2, M4 and M5 of
# docs/design/london-data.md that come under the registry's headings for housing,
# transport, schools, safety and air, with the stops and the health sites that the
# registry keeps under destination search.
#
# Written before any fetch. Every `page` is the registry entry's own: its
# `url`, or an address under its `evidence_urls`. Every address of a file was read
# on a publisher's page on 2026-09-23, through a reader that extracts the text of a
# page. An extraction is not the page. So no person has seen an address here, and
# no fetch has tried one. No address was guessed, and none was built from a
# pattern. The reader was asked twice of each page, in different words, and an
# address is kept only where it gave the same both times. The page itself may have
# been fetched only once. Each file's notes say where its address was read.
#
# Each address was then read a second time, the same day, by a reader that was
# asked for it twice, in different words, and was never given the address. Every
# one came out as it stands here, letter for letter. That is still an extraction.
#
# In the order to fetch: what the most building waits on first, and the small
# before the large where two files serve the same end. First what the second
# milestone needs, then cost and the places to reach of the fourth, then what no
# milestone names.
#
# Four kinds of file stand here.
#
#   Ready to fetch, eleven. Seven whose page is on the host the file is on:
#   osm-greater-london, rents-london-districts, rents-index, median-prices-msoa,
#   sales-msoa, lower-quartile-prices-msoa and air-pm25-2024. Each has "url"
#   under `unsure`, because its page writes the address as a path and not whole.
#   And four whose publisher hands the file out from another host:
#   ofsted-latest-inspections, uk-hpi-full-file, nhs-trust-sites and nhs-trusts.
#   Each of the four has "url" under `unsure` too. The registry entry of each of
#   the eleven names the address of its file under `file_urls`. Open each of the
#   eleven once in a browser before the first fetch.
#
#   Named by the registry since, and not yet fetched, three: price-paid-2025,
#   price-paid-2024 and price-paid-2023. The publisher hands them out from
#   price-paid-data.publicdata.landregistry.gov.uk. Until 2026-09-24 the
#   registry entry of the source named no address there, so `url` was left
#   empty. The entry now names each under `file_urls`, as its page of yearly
#   files gave it to four readings on two days. No fetch has tried one. Each
#   file is replaced on the 20th working day of a month: a fetch made after
#   28 September 2026 states the edition again first.
#
#   Named by the registry since, and fetched, one: naptan-national, on
#   naptan.api.dft.gov.uk. It waited on the registry as the three above do. The
#   entry now names its address under `file_urls`. It was fetched on 2026-09-24
#   and has its receipt. It states no edition, so its edition is the day it was
#   retrieved.
#
#   Saved by a person, three: naptan-london, gias-establishments and
#   police-crime-london. Each is made by a form on the publisher's page, so it has
#   no address to read. Save it in a browser and hand it over with the step
#   `by-hand`, which holds the address it was saved from to the registry entry as
#   fetch does. Each was saved on 2026-09-24. The address is the one the browser
#   recorded on the file, and the registry entry of each names it. Two of the
#   three came from a host that is not the host of the publisher's pages.
#
# The sizes the pages give come to about 0.8 GB, with the sales file for 2023
# taken as 164 MB. With a guess for each file whose page gives none, or gives one
# that is not believed, the list is about 1.1 GB: recorded crime about 300 MB, the
# price index 35 MB, and the rest about 20 MB together. The limits under
# `max_bytes` come to more, as each is set above its file.
#
# Not listed, and why:
#   - The stock of homes, voa-council-tax-stock-of-properties: it is in list m1.
#   - Nitrogen dioxide and File 8 of the Indices of Deprivation: both are in list m1.
#   - Census tables of homes and of tenure: not yet listed.
#   - TfL's timetables, its station files and its planner: each asks for an account
#     on TfL's portal first, and the licence runs from the day of registration.
#   - The archive of data.police.uk: each month's file holds stop and search and
#     outcomes, which the registry entry forbids. Only the form is used.
#   - Other editions of the London rent workbook: the entry holds edition 3389 alone.
#   - The children's centre file of GIAS: nobody has confirmed that the entry covers it.
#   - GP practices, branch surgeries and dispensaries, the reports epraccur, ebranchs
#     and edispensary: the entry nhs-ods is named for trusts and hospital sites, and
#     its conditions give its use as resolving the names of hospitals. They were
#     listed here and were taken out. They come back when the entry covers them, in
#     a change that a person reads. The page that lists them,
#     .../csv-downloads/gp-and-gp-practice-related-data on digital.nhs.uk, lists
#     reports about people too, and none of those may ever be listed.
#   - Every source that is gated, held or banned, whatever the plan says of it:
#     the rail schedule, school results, the noise maps for roads and railways,
#     Ofcom's coverage files, London's own air quality grids.
#   - The postcode directory, the centres of LSOAs and the population estimates:
#     cost, journeys and crime rates need them, and the registry keeps them under
#     geography, which is another list's.
#
# Editions. The street extract and the two NHS reports have no edition on their
# publisher's page. Each was fetched on 2026-09-23 and kept in the store with no
# receipt. On 2026-09-24 each was opened for what dates it, and for nothing else.
# The rule that is followed, in three lines:
#   1. The edition is what the publisher calls this version: a label, a number, a time.
#   2. Where it calls it nothing and the file gives a day, the edition is that day.
#   3. Where neither gives one, it is the day the file was retrieved, written so.
# Never a guess. The period is the day the data is as at. A day that is about the
# file and not about its data is not the period of its data.
#
# A list cannot state the edition of a file that its publisher replaces under one
# address: what a list states is written on whatever arrives. So the list states
# none for these three, and says under `edition_from` where the file states its own.
# Fetch reads that in what arrives, before anything is kept, and reads nothing else
# of the file. The receipt says where its edition was read. A file that holds no time
# there is kept with no receipt, `why=34`. A file that holds the edition of a file
# that has its receipt, and is not that file, is refused, `why=35`.
#
# The street extract gives its edition and its period: the time its header block
# says its data runs to. An NHS report holds no date. Its edition is the day it was
# retrieved, which fetch writes from its own clock. Its period is that day: the
# report is made when it is asked for, and its page says the data behind it is
# updated each night. docs/research/data/m2-files.md says what each file held on
# 2026-09-24.
#
# `uv run python -m burro_pipeline plan --list m2-living --words` says what each
# file still needs.
schema_version = 1
build = "m2-living"

# 1. What the second milestone needs: stops and stations for the station walk, schools,
# and the streets for the routing benchmark. The first two are saved by a person.

[[file]]
item = "naptan-london"
source_id = "dft-naptan"
use = "scoring"
what = "NaPTAN stops and stations for Greater London / London (490), by local authority"
format = "csv"
page = "https://beta-naptan.dft.gov.uk/"
max_bytes = 20_000_000
edition = "saved 2026-09-24"
data_period = { as_at = "2026-09-24" }
by_hand = true
notes = "Saved by a person on 2026-09-24, from the form for a download by authority, with 'Greater London / London (490)' chosen and CSV. It arrived as a CSV and in no zip, of 4,507,776 bytes, under the name 490Stops.csv. The browser recorded on the file the address it was saved from, https://beta-naptan.dft.gov.uk/Download/MultipleLa, and that it was sent there from the page above. The registry entry names that address under file_urls, and by-hand is given it. The publisher's pages for downloads, https://beta-naptan.dft.gov.uk/download and https://beta-naptan.dft.gov.uk/download/la, were read on 2026-09-23 through a reader that extracts, twice, in different words, and the second again on 2026-09-24. It is a form: an authority is chosen, then CSV or XML, then a button is pressed. The page shows no address of a file. The pages say the data is under the Open Government Licence v3.0. No sign-in was asked for. Neither the page nor the name of the file states an edition, so the edition is the day the file was saved, written so, and the period is that day: the publisher says the data changes daily. The use is scoring, which is what the file is first put to. A step that routes, searches or shows a station asks the gate for its own use when it opens the file, and the entry allows each. One station is many nodes. The stops of London alone leave out a station just past London's edge. The national file is listed on the record at data.gov.uk that the registry entry holds, as https://naptan.api.dft.gov.uk/v1/access-nodes?dataFormat=csv , on a host the entry does not name. It is listed below as naptan-national, and is held back until the entry names that address."

[[file]]
item = "naptan-national"
source_id = "dft-naptan"
use = "scoring"
what = "NaPTAN stops and stations, every stop of England, Scotland and Wales, as one CSV"
format = "csv"
page = "https://www.data.gov.uk/dataset/ff93ffc1-6656-47d8-9155-85ea0b8f2251/naptan"
url = "https://naptan.api.dft.gov.uk/v1/access-nodes?dataFormat=csv"
url_parameters = ["dataFormat"]
max_bytes = 150_000_000
# The file states no edition, and is made again each day under one address.
edition_from = { where = "retrieved", at = "", words = "retrieved", period_too = true }
unsure = ["max_bytes"]
notes = "Address read on 2026-09-24, on the page above, through a reader that extracts: https://naptan.api.dft.gov.uk/v1/access-nodes?dataFormat=csv . The page is the record of the dataset at data.gov.uk. The record names the Department for Transport as its publisher, and lists the address as the national dataset in CSV. The reader was asked twice, in different words, and gave the same address both times, written whole. The parameter dataFormat names the format and is part of the address. The host is naptan.api.dft.gov.uk. The publisher's own page for the national download, https://beta-naptan.dft.gov.uk/download/national, was read the same day. It names that host as the publisher's API, and offers the same file from a form, as a CSV of 96.9MB or as XML of 552.2MB, with no address of a file. The registry entry names the address under file_urls, beside the one address the file of London was saved from. The file was fetched on 2026-09-24 and has its receipt: a CSV of 101,596,247 bytes, which the publisher names Stops.csv. Why it is wanted: the file of London holds the ways in to a station and no station, and holds nothing outside London. So a home near London's edge may have a nearer station outside, and the measure leaves such a home out. The national file holds the stations and their platforms, which the publisher issues under the authorities 910 and 940, and the ways in of every authority round London. A step that reads it keeps the rows within reach of London and drops the rest. The page states no edition and the address names none, and the file is made again each day, so a later file arrives at this address. So the list states no edition. The file states none of its own: each row holds the day it was made and the day it was last changed, and nothing dates the file as a whole. That was seen on 2026-09-24 in the file kept in the store on 2026-09-24, f-7fbe1ec6aaff. So the edition is the day the file was retrieved, written as such: fetch writes the day of the fetch, and reads nothing of the file for it. The period is that day, because the file is the list of stops as the publisher held it when it was asked for. The same file retrieved on a later day keeps the day of its first receipt. It is laid out as the file of London is, in the same 43 columns, and holds 435,633 rows. No measure reads it yet: docs/research/data/stations.md says what the nearest station and the table of stations as places must change to read it."

