by_hand = true
notes = "Saved by a person on 2026-09-24, from the form on the page above. It arrived as a zip of 8,119,289 bytes, under the name extract.zip, with one file inside, edubasealldata20260924.csv, of 64,682,618 bytes. The browser recorded on the file the address it was saved from, https://ea-edubase-api-prod.azurewebsites.net/edubase/downloads/File.xhtml with one parameter, and that it was sent there from the publisher's site. That host is not the host of the publisher's pages. The registry entry names the address under file_urls, with no parameter, and by-hand is given it so. No page of this publisher was read for this list, by any program. Its acceptable use policy, as the registry entry records it, forbids reading the site's pages with a program, and names the public downloads as the route for taking the data. The edition is the day in the name of the file inside the zip, which is the day it was saved, and the period is that day: the publisher says the data changes daily. The use is scoring, which is what the file is first put to. A step that searches for a school or shows one asks the gate for its own use when it opens the file, and the entry allows each. National: no file for London is offered. The file holds the names of head teachers and counts of pupils: read named columns only, and drop both at ingest, as the registry entry says. The religious character of a school is never read. The children's centre file is not listed: nobody has confirmed that the registry entry covers it."

