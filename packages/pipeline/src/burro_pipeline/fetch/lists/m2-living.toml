notes = "Address read on 2026-09-23, on the page above, through a reader that extracts. The reader was asked twice, in different words, and gave the same address both times. The page writes the address as a path that starts from the page, ../datastore/pcm/mappm252024g.csv, under the link mappm252024g. The address here is that path worked out against the page's own address, as a browser does, and as the file for nitrogen dioxide in list m1 was. Open it once in a browser. The page says the g stands for gravimetric units. The page gives no size: the file for nitrogen dioxide of the same year is 7.9 MB, as its receipt says. National: one CSV for the United Kingdom, and no file for London is offered. The page says the first four rows hold the pollutant, the year, the metric and the units, and the data begins on row 6. It says new maps are made available by the middle of October, so a 2025 map may be days away. The registry entry covers nitrogen dioxide and PM2.5 alone: the page also lists PM10 and nitrogen oxides, which are not taken. PM2.5 needs its own place on the list of features before it is used."

[[file]]
item = "police-crime-london"
source_id = "police-uk-street-level-crime"
use = "scoring"
what = "Street-level crime, Metropolitan Police Service and City of London Police, August 2023 to July 2026, as the form made it with all three boxes ticked: the crime files alone are read"
format = "zip"
page = "https://data.police.uk/data/"
max_bytes = 700_000_000
edition = "August 2023 to July 2026"
data_period = { start = "2023-08", end = "2026-07" }
by_hand = true
notes = "Saved by a person on 2026-09-24, from the form on the page above, for the two forces and for every month the form offers. All three boxes of the form were ticked. So the zip, of 333,736,416 bytes, holds 215 files in 36 folders, one for each month from 2023-08 to 2026-07: 72 that end -street.csv, which are the crime files, 72 that end -outcomes.csv and 71 that end -stop-and-search.csv. The registry entry forbids reading the last two kinds, and stop and search holds the ethnicity, the gender and the age of a person stopped. The founder decided on 2026-09-24 that the zip is kept as it was saved, that the crime files alone are read, and that the rest is never opened. derive/street_crime_files.py is the one reader of this source: it opens a file whose name ends -street.csv and refuses any other, and a test holds it to that. The next file is saved with 'Include crime data' ticked and the other two boxes not. The browser recorded on the file the address it was saved from, https://policeuk-data.s3.amazonaws.com/download/8af8d28d28ffb22827ea2b9ee45fb67e9dd724fd.zip, and that it was sent there from the publisher's site. That host is not the host of the publisher's pages. The registry entry names the address under file_urls, and by-hand is given it. Never take a file from the archive, at /data/archive/ on the publisher's site: a month's file there holds every force, with outcomes and stop and search. Never the API. The months were read from the names of the folders. The rows bear them out: every row of each of the 72 crime files states a month, and it is the month of its folder, from 2023-08 to 2026-07. A point is a snapped point and not where a crime happened. Which census the LSOA code of a row follows is not known. The registry says months of the Metropolitan Police are missing in 2024: the zip holds a crime file for each force and month, and no file of 2024 holds fewer records than the months beside it. The files of the Metropolitan Police for May, June and July 2026 hold about a twentieth of the criminal damage and arson of any earlier month, and nothing in them says why."