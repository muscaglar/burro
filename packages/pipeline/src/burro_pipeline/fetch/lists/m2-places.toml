notes = "Address read on 2026-09-23 through a reader that extracts. It was not on the page above, which holds no address of a file. It was read on the publisher's own listing of the downloads of this product, https://api.os.uk/downloads/v1/products/BoundaryLine/downloads. That address was read in the publisher's record of the product, and that record's address in its list of products, https://api.os.uk/downloads/v1/products, which its documentation at docs.os.uk names. The reader was asked twice, in different words, and gave the same address both times. The listing gives the file as bdline_gpkg_gb.zip, of 807,724,473 bytes, with md5 cfbda533db08e69f5b4fc37631ba1779, and the publisher's list of products gives the version as 2026-05. The publisher offers Great Britain only. The GML is 167,677,814 bytes, if this is too large for what it gives. The publisher describes the product as 'From parliamentary constituencies to council wards'. That it holds the boroughs and wards of London was not read on any page: three pages of its documentation were read, and none names them. Look on first fetch. Borough outlines can be made from output areas instead, and nest exactly. The address names no release, so a later release will arrive at the same address: if what arrives is not the size above, the edition here is wrong. The documentation says the address answers with status 307 and the address of the file, and does not say on which host: open it once in a browser, and name that host under may_redirect_to. What is inside the zip is not known. Save the licence file from inside it, as the registry entry asks. The registry entry names api.os.uk by the publisher's record of this product in its download service."

[[file]]
item = "postcode-directory"
source_id = "ons-postcode-directory"
use = "cells"
what = "ONS Postcode Directory, August 2026, as the zip that holds its user guide"
format = "zip"
page = "https://www.ons.gov.uk/methodology/geography/geographicalproducts/postcodeproducts"
max_bytes = 600_000_000
edition = "August 2026"
data_period = { as_at = "2026-08" }
by_hand = true
notes = "Saved by a person on 2026-09-24, from the publisher's portal, which the page above links to. It arrived as a zip of 253,928,895 bytes, under the name ONSPD_AUG_2026.zip. The portal's own record of the item, https://geoportal.statistics.gov.uk/api/search/v1/collections/all/items/9e5a92a3cfb14dc7ad43d6ea7a7b8c7f, was opened on 2026-09-24 through a reader that extracts, twice, in different words: it gives the title 'ONS Postcode Directory (August 2026)', the same name and the same size to the byte. It says an update of 07/09/2026 corrected the names of the fields in the header of the CSV and did not alter the data. So the edition is the publisher's own, and the file is the one as it stood after that update. The period is the month of the edition. The browser recorded on the file the address it was saved from, on www.arcgis.com, with a signed key among its parameters. The registry entry names the address under file_urls with every parameter left out, and by-hand is given it so: the key is written nowhere. That host is not the host of the portal's pages. The zip holds 226 names, four of them folders: the whole directory once as a CSV of 1,483,120,391 bytes and once as text, the same again as a CSV for each of 124 postcode areas, 94 files of names and codes, and the user guide twice, as a PDF and as an OpenDocument text. The names were read from the list the zip keeps of itself, before any file in it was opened. The licence section of the guide is saved as registry/evidence/ons-postcode-directory-2026-09-24.txt, as the registry entry asks. data.gov.uk held no record of the zip for August 2026 that day: it held the user guide and the hosted table, which is not the zip. The United Kingdom only: the publisher offers no file for London. Keep the rows of London's authorities and no other, and never pass the national file on. Drop every row of Northern Ireland at ingest: the file for the postcode area BT is never opened, and a row of the whole file whose postcode begins BT is dropped. Milestone M4 needs it, and the check that every postcode of London maps to an area."
