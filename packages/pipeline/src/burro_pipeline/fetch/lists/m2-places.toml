# The files of places and the land: what milestones M2 and M3 of
# docs/design/london-data.md need under the registry's headings for geography,
# the environment, heritage and places. Homes, journeys, schools and safety
# are in the list m2-living.
#
# Written before any fetch. Every `page` is the registry entry's own: its
# `url`, or an address under its `evidence_urls`. Every address of a file was
# read on a publisher's page on 2026-09-23, through a reader that extracts the
# text of a page. An extraction is not the page. The reader was asked twice of
# each page, in different words, and an address was kept only where both
# answers gave the same. The page itself may have been fetched only once. No
# address was guessed, and none was built from a pattern. Each file's notes say
# where its address was read.
#
# Each of the 44 addresses was then read a second time, the same day, by a
# reader that was asked for it twice, in different words, and was never given
# the address. All 44 came out as they stand here, letter for letter. So did
# the size and the md5 of each file of Ordnance Survey, and the version of each
# product. That is still an extraction: no person has seen an address here,
# and no fetch has tried one.
#
# In the order to fetch: what the most building waits on first, and the small
# before the large where two files serve the same end. First what naming areas
# and every walk wait on. Then what the measures of the second milestone need.
# Then what is needed later, or gives least for its size.
#
#   With an address that a fetch may ask, 44 files. The registry entry of each
#   names its address under `file_urls`. The town centre boundaries
#   and the 33 files of the food hygiene register, one for each London
#   authority: the address of the first is written whole on its page, and each
#   of the 33 is written there as a path, so "url" is under `unsure`. None of
#   the 34 has an edition on its page. Each was fetched on 2026-09-23 and kept
#   in the store with no receipt. The list says where each file states its own
#   edition, and fetch reads it in what arrives: see Editions, below.
#   And eight whose publisher hands the file out from another host than its
#   pages: the six files of Ordnance Survey, on api.os.uk, and the two of the
#   statistics office, on open-geography-portalx-ons.hub.arcgis.com. Each
#   entry also holds the publisher's own record or page on that host, and says
#   in its notes what was read of it.
#
#   And the two of Planning Data, on files.planning.data.gov.uk. They were
#   held back until 2026-09-24, while the registry entry of each named no
#   address on that host. The address first read was of the CSV. A person then
#   read the address of the GeoJSON on each page, in a browser, and the entry
#   names it. Each was fetched that day, and has its receipt.
#
#   Saved by a person, 1 file: the postcode directory, on 2026-09-24, from the
#   publisher's portal. Its notes say what was read of it.
#
# Where a download is handed on to is known for the statistics office alone:
# its hosts are those the first fetch met on 2026-09-23. Ordnance Survey's
# documentation says a download is answered with a redirect, and does not say
# to which host. For every other publisher here nothing is known. A fetch that
# is sent on to a host the list does not name stops, and prints the start of a
# hash of that host's name. Open the address once in a browser, and name the
# host under `may_redirect_to`.
#
# What the 44 files whose address was read come to: about 2.4 GB. 1,989 MB of
# it is sizes the publishers give, to the byte. The rest was a guess: about
# 100 MB for the food register, 300 MB for the two files of Planning Data, and
# 35 MB for the two of the statistics office. The two of Planning Data came to
# 271 MB as fetched on 2026-09-24. Their limits come to 3,877 MB,
# so no fetch of them can pass 4 GB. The postcode directory is saved by a
# person and is not counted: it is 254 MB.
#
# Not listed, and why:
#   overture-places: in the list m2-culture, which takes London's part of
#     one file
#   wikidata-places-and-landmarks: no file, but a query that nobody has written
#   uber-h3: software, and no file
#   ons-lsoa-population-estimates: the file holds age and sex for each area
#   defra-pcm-background-air, mhclg-iod-2025-underlying-indicators, and the
#     boundaries, centres and lookup of output areas and LSOAs: in the list m1
#   dft-naptan, for the stations a reviewer of a border is shown: in the list
#     m2-living, as naptan-london, to be saved by a person
#   every source that is gated, held or banned
#
# Editions. The town centre boundaries and the 33 files of the food hygiene register
# have no edition on their publisher's page. Each was fetched on 2026-09-23 and kept
# in the store with no receipt. On 2026-09-24 each was opened for what dates it,
# and for nothing else.
# The rule that is followed, in three lines:
#   1. The edition is what the publisher calls this version: a label, a number, a time.
#   2. Where it calls it nothing and the file gives a day, the edition is that day.
#   3. Where neither gives one, it is the day the file was retrieved, written so.
# Never a guess. The period is the day the data is as at. For a register, that is
# the day of its extract. A day that is about the file and not about its data is
# not the period of its data. A boundary is as the file holds it, so for a file of
# boundaries the day it was last changed is the day its data is as at, and the list
# states it so.
#
# A list cannot state the edition of a file that its publisher replaces under one
# address: what a list states is written on whatever arrives. So under rules 2 and 3
# the list states none, and says under `edition_from` where the file states its own.
# Fetch reads that in what arrives, before anything is kept, and reads nothing else
# of the file. The receipt says where its edition was read. A file that holds no day
# there is kept with no receipt, `why=34`. A file that holds the day of a file that
# has its receipt, and is not that file, is refused, `why=35`.
#
# The 33 files of the food register give their edition and their period: the day
# that `ExtractDate` holds, in the header. The town centre boundaries give their
# edition, the day the file was last changed, and fetch takes no period from it.
# The list states the period, as that same day: neither the file nor any page
# states a day the boundaries are as at, and a boundary is as the file holds it.
# The notes of the item say what was read, and what the period does not say. A
# program read it, and no person has: whether it stands is the founder's to confirm.
# docs/research/data/m2-files.md says what each file held on 2026-09-24.
#
# `uv run python -m burro_pipeline plan --list m2-places --words` says what each
# file still needs.
schema_version = 1
build = "m2-places"

# 1. What naming areas and every walk wait on: the centres, the areas of the preview,
# the names of places, and the roads. Milestones M2 and M3.

[[file]]
item = "gla-town-centres"
source_id = "gla-town-centre-boundaries"
use = "scoring"
what = "Town centre boundaries of the London Plan, GeoPackage"
format = "gpkg"
page = "https://data.london.gov.uk/dataset/town-centre-boundaries-e55z7/"
url = "https://data.london.gov.uk/download/e55z7/84b3939e-c301-48e5-85e0-31699b1cb751/Town_Centres_Boundaries.gpkg"
max_bytes = 2_000_000
edition_from = { where = "geopackage", at = "gpkg_contents.last_change", words = "last changed", period_too = false }
data_period = { as_at = "2025-12-22" }
notes = "Address read on 2026-09-23, on the page above, through a reader that extracts. The reader was asked twice, in different words, and gave the same address both times. It is written whole on the page. The publisher's own record of the dataset, https://data.london.gov.uk/api/dataset/town-centre-boundaries-e55z7, gives the same address, 1,712,128 bytes, and 2025-12-23 as the day the file was last checked. The page gives 1.63 MB. London only. Whether a download is sent on to another host is not known. The page states no edition, and the address names none, so a later file may arrive at it. So the list states no edition, and says where the file states its own: fetch reads the day its contents were last changed, in its table gpkg_contents, in what arrives. It was read on 2026-09-24 in the file kept in the store on 2026-09-23, f-4076c2bc276b: the table gives 2025-12-22T16:37:50.337Z as the last change of its one layer, which is the day before the day the publisher's record gives. If that file arrives again, its edition is last changed 2025-12-22. That day is about the file, and fetch never takes it for the period of the data: the period is the list's to state. The file says no more of when: its columns for the day a boundary was added, updated or removed are empty in every row, and its metadata holds no date. The step describe read the same file on 2026-09-24: one layer, town_centres, of 234 outlines on the National Grid, with 30 columns, of which firstaddeddate, lastupdateddate and removeddate are the three for a day. So the file states no day that its boundaries are as at. The page was read again on 2026-09-24, through a reader that extracts, asked for every date on it. It gives one, 'Last Update: 9 months ago', and states no day and no year that the boundaries are as at, and no plan that they are of. The page holds one year beside it, in its statement of rights: it names 2019 for the Ordnance Survey data the boundaries are based on. That is the year of the mapping, and the page does not say it is the year the boundaries are as at. The publisher's own record of the dataset gives 2019-08-30 as the day it was created and 2025-12-23 as the day it was updated, and leaves both ends of the period it covers empty. So the page states no period either. The London Plan's own page of its town centre network, https://www.london.gov.uk/programmes-strategies/planning/london-plan/the-london-plan-2021-online/annex-1-town-centre-network, was read on 2026-09-24, through a reader that extracts, asked twice in different words. Both readings gave 'Publication date: Monday 1 March 2021' and the status 'Adopted'. Both found that the page classes the centres, gives no day on which a centre was designated or a boundary drawn, and does not say who draws a boundary. The page of the chapter that holds the plan's policies on town centres was cut short by the reader before it reached them, and was not read. So no page states a day of designation that could stand as the period. The period stated here is the day of that last change, for one reason: a boundary is as the file holds it. An outline counts nothing over a span of days, as a register or a census does. It is a line its publisher draws, and what the publisher's file held when it was last changed is what the publisher gave the boundaries as, as at that day. It is the day before its record says the dataset was updated. What the period does not say: the day any boundary was drawn or adopted, which the file does not give, or that no borough has changed one since. So beside a figure the words are that the boundaries are as the publisher's file held them on that day, and never that a centre was designated on it. A program read the file and the pages, and no person has. The founder confirmed on 2026-09-24 that the period stands. The period is of the file that was read and of no other: if the line of a fetch reads new=1, another file has arrived, and the period is stated again before its receipt is used. The boundaries are indicative, as the page says. Each boundary carries a name and a class: docs/research/data/m3-files.md has the eight classes the file writes. The seeds of the named areas read it too, under the use gazetteer, which the entry allows."

