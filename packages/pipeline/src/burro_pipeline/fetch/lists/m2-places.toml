notes = "Address read on 2026-09-23, on the page above, under London, through a reader that extracts. The reader was asked twice, in different words, and gave the same both times. The page writes it as a path from the top of the site, /api/open-data-files/FHRS501en-GB.xml, and the address here is that path worked out against the page's own address, as a browser does. In one reading the page gave 1,464 businesses and 17/09/2026 as the last update. It gives no size, so the limit is a guess. The page states no edition, and the publisher replaces the file under this address. So the list states none, and says where the file states its own: fetch reads the day that ExtractDate holds in the header of what arrives, and writes the receipt from it. The period is that day: the register as it stood at the extract. The header was read on 2026-09-24 in the file kept in the store on 2026-09-23, f-e52332fb6d6e: it says 2026-09-16, which is the day before the last update the page gave. If that file arrives again, its edition is extract of 2026-09-16. Counts only: never a rating, never a row."

