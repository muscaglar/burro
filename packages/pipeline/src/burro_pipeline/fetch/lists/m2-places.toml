notes = "Address read on 2026-09-23, on the page above, through a reader that extracts. The reader was asked twice, in different words, and gave the same address both times. The page lists it as CSV. The item named in the address is the one the registry entry holds. The page lists the publisher's own portal page for the item as https://open-geography-portalx-ons.hub.arcgis.com/datasets/ons::lower-layer-super-output-areas-december-2021-ew-population-weighted-centroids-3, which is what the entries behind the first build hold to name that host, and what the registry entry of this source holds too. The reader gave 4 MB as the size on the page, in one reading. The file of the same kind for output areas was 22,030,298 bytes when it was fetched. England and Wales: the publisher offers no file for London. Milestone M5 needs it, and nothing before. The edition is from the name of the service, as the registry entry gives it: the title on the page carries no version."

