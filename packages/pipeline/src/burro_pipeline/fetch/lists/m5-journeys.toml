# The files of a journey: what milestones M5 and M7 of docs/design/london-data.md
# need that no other list holds. docs/design/london-data-timetables.md says what
# each publisher's pages said on 2026-09-24, and what a person must sign up for.
#
# Written before any fetch. Every `page` is the registry entry's own: its `url`,
# or an address under its `evidence_urls`. Every page was read on 2026-09-24,
# through a reader that extracts the text of a page. An extraction is not the
# page. The reader was asked twice of each page, in different words, and a thing
# is kept only where it gave the same both times. No address was guessed, and
# none was built from a pattern.
#
# One file stands here, and it has no address yet.
#
#   tfl-timetables. No timetable of London is given to a person who has signed
#   nothing. Transport for London's licence runs "from the date of
#   registration", and its page says "You need to register to gain access to the
#   live feeds". The page links one zip, and says of it that it "is not updated
#   and is for demonstration purposes only". It names no address for the file
#   that is kept up to date. So `url` is empty, and the notes say where an
#   address was read. When a person has registered and has seen where the file
#   comes from, the registry entry names the address under `file_urls` and this
#   list names it under `url`, in one change that a person reads.
#
# A file is listed once, and a build may take several lists. So what else a
# journey needs is left where it stands:
#
#   osm-geofabrik-greater-london, the streets: in the list m2-living, as
#     osm-greater-london
#   dft-naptan, the stops and stations: in the list m2-living, as naptan-london,
#     to be saved by a person
#   ons-lsoa-pwc-2021, where a journey starts: in the list m2-places, as
#     lsoa-centres
#   uber-h3, where a journey ends: software, and no file
#
# Not listed, and why:
#
#   network-rail-nwr-schedule, the rail schedule, which holds National Rail, the
#     London Overground and the Elizabeth line: gated. A person subscribes and
#     saves the agreement first. The gate refuses it for every use, and one
#     refusal stops every file of a list
#   rdg-timetable-feed and planarnetwork-gb-transit-rail-gtfs: held. The first is
#     licensed for research and analysis alone, and the second is made from it
#   dft-bods-london-gtfs and traveline-tnds, a second source of bus timetables:
#     held. Each asks for an account, and the terms shown at sign-up are not read
#   tfl-unified-api-journey-planner: a service that answers one question at a
#     time, and no file. It checks a build and is never an input to one
#   tfl-step-free-station-topology: facts about stations, and no part of a time
#
# `uv run python -m burro_pipeline plan --list m5-journeys --words` says what the
# file still needs.
schema_version = 1
build = "m5-journeys"

[[file]]
item = "tfl-timetables"
source_id = "tfl-journey-planner-timetables"
use = "routing"
what = "Journey Planner timetables, TransXChange XML in a zip: London Underground, bus, DLR, tram, cable car and river services"
format = "zip"
page = "https://tfl.gov.uk/info-for/open-data-users/our-open-data"
# Empty until the registry entry names the address of the file. What was read is in the notes.
url = ""
max_bytes = 500_000_000
unsure = ["url", "max_bytes", "edition", "data_period"]
notes = "No address. The page above was read on 2026-09-24, through a reader that extracts, twice, in different words. It links one zip, of 24.31MB, at /cdn/static/cms/documents/journey-planner-timetables.zip on the page's own host, and says of it: 'The example feed below is not updated and is for demonstration purposes only. You need to register to gain access to the live feeds'. That zip is not taken: a time worked out from it would rest on a timetable of no known date. The page names no address for the file that is kept up to date, and sends the reader to the portal, https://api-portal.tfl.gov.uk/, where a person must register first. Two addresses were read on the publisher's own forum, techforum.tfl.gov.uk, which the registry entry does not hold. In two posts of 2025, by people who use the file: https://tfl.gov.uk/tfl/syndication/feeds/journey-planner-timetables.zip . In a post of 3 September 2026 by the publisher's staff, which says a further TransXChange dataset had been issued: tfl.gov.uk/journey-planner-timetables.zip , written without https. Neither is written under url: the registry entry names no address for its files, and fetch refuses an address that the entry does not name. Whether the file asks for the key of an account is not known. If it does, fetch cannot take it today, because an address in a list holds no key: a person saves the file and hands it over with by-hand. Whoever writes the address down writes it with no key in it: if a key stands after the question mark, the question mark and all that follows are left out. Register before the file is opened: the licence runs from the date of registration. The page says 'The timetables are updated every 7 days. They do not take account of planned engineering works', and that a fresh copy is published every 1440 minutes. The publisher's staff call the weekly issue a drop. So the file is replaced under one address, and the page states no edition. What dates the file is inside it and nobody has opened it: state the edition and the period when a person has read them there. The period is the days the timetables say they run on, and never the day the file was fetched. The size is not known: the limit is a guess, set far above the example. The modes are those the page names. It does not name the London Overground or the Elizabeth line: count the lines in the file before anything is said of either. For routing, and for the lines of a station: the registry entry allows routing, scoring and display."
