[[source]]
id = "arts-council-england-accredited-museums"
name = "UK Museum Accreditation Scheme: list of accredited museums"
publisher = "Arts Council England"
url = "https://www.artscouncil.org.uk/supporting-arts-museums-and-libraries/uk-museum-accreditation-scheme/accreditation-statistics-and-list-accredited-museums"
dimension = "culture"
licence = "Bespoke-terms"
commercial_use = "yes_with_conditions"
share_alike = false
attribution = "List of accredited museums: Arts Council England, used with permission."
attribution_verified = false
conditions = [
    "Permission in writing, as the founder reports. The founder asked Arts Council England to reuse its basic dataset for libraries, its list of accredited museums and its National Portfolio investment programme data in a commercial service, to count recognised cultural venues and libraries. The founder reports that Arts Council England answered in writing on 2026-09-23, giving permission.",
    "The permission covers what was asked and no more. Counts only. Showing a museum's name was not asked for.",
    "A change of use means asking Arts Council England again, before the change is made.",
    "Credit Arts Council England wherever a count from the list is shown. The credit is Burro's wording until the owner publishes its own.",
    "Say 'accredited museum' and give the date of the list. Accreditation is a standard for how a museum is run. It is not a rating. Never say 'best' or 'top', and never suggest that Arts Council England backs Burro or an area.",
    "Drop any field that names a person.",
]
status = "gated"
status_reason = "The permission is a written reply that only the founder has read. The founder holds the reply. No published licence stands behind this source: nobody has read the publisher's pages. What would settle it: the founder files a dated note of the reply in registry/evidence."
uses = ["scoring"]
verified_how = "secondary_source"
verified_on = 2026-09-23
notes = "What the founder reported is noted in registry/evidence/arts-council-england-accredited-museums-2026-09-23.md. No page of the publisher's site was read for this entry. The address above is the one the research recorded. Nobody has opened it, so it may not be the page. The attribution is Burro's own wording, not the publisher's. verified_how is secondary_source because whoever wrote this entry has not read the reply, and so that the entry cannot be approved by changing its status alone. Nobody has seen the list: whether it holds an address for each museum is not known, and without one a museum cannot be placed."

