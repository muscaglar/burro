[[source]]
id = "gla-cultural-infrastructure-map-2023-gla-commissioned-layers"
name = "Cultural Infrastructure Map 2023: layers commissioned by the GLA and led by WMT Urban Research Unit"
publisher = "Greater London Authority"
url = "https://data.london.gov.uk/dataset/cultural-infrastructure-map-2023"
dimension = "culture"
licence = "OGL-3.0"
licence_url = "https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/"
commercial_use = "yes_with_conditions"
share_alike = false
attribution = "Source: Greater London Authority, Cultural Infrastructure Map 2023. Contains public sector information licensed under the Open Government Licence v3.0. Contains OS data © Crown copyright and database rights 2019."
attribution_verified = false
conditions = [
    "Covers only the 'CIM 2023' per-layer CSV files whose description says 'Commissioned by the Greater London Authority (GLA). Led by: WMT Urban Research Unit' or 'Led by the Greater London Authority (GLA) in collaboration with WMT Urban Research Unit', each with 'Credit for use: GLA': artists workspaces, makerspaces, creative co-working desk space, creative workspaces, commercial galleries, museums and public galleries, fashion and design, jewellery design, textile design, making and manufacturing, prop and costume making, set and exhibition building, dance performance venues, dance rehearsal studios, theatres, theatre rehearsal studios, music rehearsal studios, music recording studios, cinemas, arts centres, plus Creative Enterprise Zone boundaries.",
    "Excludes the LGBTQ+ venues, libraries, archives and all music venue, grassroots and nightclub files, the undescribed 2022 capture CSVs, the combined geopackage, the borough and zone zips and the web map service. Each has its own entry or is unregistered.",
    "The 2023 Summary Note (WMT Urban Research Unit and Mayor of London, 13 January 2023) says the update 'drew on a review of the original datasets alongside other sources and primary research', so 2023 records descend from the 2018 and 2019 capture, which named outside bodies for several layers.",
    "Layers whose 2019 predecessor named an outside body must be named one by one in any question put to the GLA: theatres (BOP with the Theatres Trust), dance performance and dance rehearsal (We Made That with Dance Umbrella), and, as reported on the 2019 page, cinemas and arts centres.",
    "The page carries 'Contains Audience Agency data' and 'Contains CAMRA data' without saying which layers. Until the GLA says which, treat both notices as possibly applying to any layer.",
    "London Datastore terms apply to every GLA dataset: state explicitly that the Greater London Authority cannot warrant the quality or accuracy of the data, and never imply GLA endorsement, affiliation, support or approval.",
    "Aggregates only. No venue lists and no venue names.",
    "OGL does not cover third-party rights the GLA is not authorised to license.",
]
status = "gated"
status_reason = "OGL v3 is confirmed on the dataset page, but third-party rights are not cleared. The page carries Audience Agency and CAMRA notices without naming layers, and the Summary Note shows the 2023 layers were built by reviewing the 2018 and 2019 datasets. The five layer data notes read on 2026-09-23 (theatres, cinemas, libraries, and both versions for museums and public galleries) give a definition, counts and a map only. They name no sources and no licence, so reading them cannot pass the gate. Gate: (1) save dated copies of the dataset page, the API record and the Summary Note; (2) get a written GLA reply confirming that OGL v3 covers each named layer, including records carried over from the 2018 and 2019 capture, and saying which layers the Audience Agency and CAMRA notices apply to; (3) any layer the reply does not clear moves to held; (4) set a no-reply date in a decision record, after which the affected tags ship on Overture and FSA alone."
uses = ["scoring"]
cadence = "Page says quarterly, but created 2023-10-12 and last updated 2024-03-15. Treat as a dated snapshot of data captured in 2022 and 2023."
verified_how = "primary_source"
verified_on = 2026-09-23
evidence_urls = [
    "https://data.london.gov.uk/dataset/cultural-infrastructure-map-2023",
    "https://data.london.gov.uk/api/dataset/cultural-infrastructure-map-2023",
    "https://data.london.gov.uk/download/23697/39b6fbb6-7b3e-47e0-beac-3b5b3da63454/01%20Summary%20Note.pdf",
    "https://data.london.gov.uk/about/terms-and-conditions/",
]
notes = "Correction to the plan: the multi-layer OGL edition is the page titled 'Cultural Infrastructure Map 2023' (89 resources, music files updated March 2024). The page titled 'Cultural Infrastructure Map 2024' holds one layer only. The GLA gives no attribution statement of its own, so the wording is Burro's: the 'Credit for use: GLA' instruction, the OGL default line and the OS notice copied from the page. WMT Urban Research Unit appears to be the research arm of We Made That, which led several 2019 layers; it is an outside contractor. The page also says the data is published under Ordnance Survey's 'presumption to publish'. Only documentation was read; no data file was downloaded or inspected."

