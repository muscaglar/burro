id = "mhclg-iod-2025-underlying-indicators"
name = "English Indices of Deprivation 2025, File 8: underlying indicators"
publisher = "Ministry of Housing, Communities and Local Government"
url = "https://www.gov.uk/government/statistics/english-indices-of-deprivation-2025"
dimension = "environment"
licence = "OGL-3.0"
licence_url = "https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/"
commercial_use = "yes"
share_alike = false
attribution = "Contains public sector information licensed under the Open Government Licence v3.0."
attribution_verified = false
conditions = [
    "Only place-based indicators may enter the product, and each needs a feature allowlist entry. The v1 indicator is noise exposure.",
    "Indicators and domains that describe residents (income, employment, health, education) and the IMD rank or decile must never be inputs to ranking or tags (PLAN section 9). This entry does not approve them for product use.",
    "The patient-to-GP ratio and broadband speed indicators are out of v1 scope (PLAN section 4).",
    "Not comparable with the 2019 indices. Do not show change over time.",
    "At first ingest, read the notes sheet in File 8 for any indicator-level third-party copyright statement and save it to registry/evidence.",
]
status = "approved"
uses = ["scoring", "display"]
cadence = "Irregular. Published 30 October 2025, updated 17 November 2025. Previous edition was 2019."
verified_how = "primary_source"
verified_on = 2026-09-23
evidence_urls = [
    "https://www.gov.uk/government/statistics/english-indices-of-deprivation-2025",
    "https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/",
    "https://assets.publishing.service.gov.uk/media/691dec012c6b98ecdbc500d4/File_8_IoD2025_Underlying_Indicators.xlsx",
]
file_urls = [
    "https://assets.publishing.service.gov.uk/media/691dec012c6b98ecdbc500d4/File_8_IoD2025_Underlying_Indicators.xlsx",
]
notes = "How it was verified: The GOV.UK release page states OGL v3.0 (drafter and reviewer both fetched it on 2026-09-23) and the verification file lists this claim as confirmed. It is a v1 source in PLAN section 7. File 8 is listed as 'File 8: Underlying indicators', an Excel file of 13.8 MB, on 2021 LSOAs. The page asks for no specific attribution statement, so the OGL default applies. File 8 was opened once for research, on a copy that was not kept (docs/research/vibes/grit.md). No step of the pipeline has fetched it, so the notes sheet check in conditions is still to do. Filed under environment because the v1 use is the noise indicator. If the offline proxy audit needs the deprivation domains, add a separate audit-only entry for Files 1 to 7 instead of widening this one. The last address under evidence_urls, on assets.publishing.service.gov.uk, is File 8 itself, as the publisher's page listed it on 2026-09-23. It was read through a reader that extracts, which was asked twice, in different words, and gave the same address both times. GOV.UK hands out files from that host, which has no pages of its own, so an entry can name it only by a file. It is there to name the host the file is on. Fetch holds a file to the addresses under file_urls. It is no evidence of the licence. No file was fetched to read the address. A file that is reissued is given a new address."

