notes = "How it was verified: The OS open data page lists OS Open Greenspace among products 'available for unrestricted, free commercial and personal reuse under the Open Government Licence (OGL)' (drafter and reviewer both fetched it on 2026-09-23). The verification file confirms OS OpenData is OGL. It is a v1 source in PLAN section 7. This clears the item the liveability report listed as unverified. OS's acknowledgments page gives the statement as 'Contains OS data © Crown copyright [and database right] [year].' The year is filled in. OS's own licence link returns a permanent redirect to OGL version 3 at the National Archives (checked today). The product page itself names no licence. The licence statement is on the OS open data page. The boundaries workstream also uses this product to cut large parks out of display polygons, so keep one shared entry. The last address under evidence_urls is the publisher's own record of this product in its download service, on api.os.uk. Ordnance Survey's documentation at docs.os.uk gives https://api.os.uk/downloads/v1/ as the address of that service. It is there to name the host the files are on. Fetch holds a file to the addresses under file_urls. It was read on 2026-09-23 through a reader that extracts, which was asked twice, in different words: it gave the product's name as 'OS Open Greenspace', its version as 2026-04 and the address of the listing of its downloads, and nothing of a licence, so it is no evidence of the licence. No file was fetched to read the address."

