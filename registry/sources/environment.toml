[[source]]
id = "mhclg-land-use-statistics-2022"
name = "Land use statistics: England 2022, live tables by LSOA and MSOA (table P405)"
publisher = "Department for Levelling Up, Housing and Communities"
url = "https://www.gov.uk/government/statistics/land-use-in-england-2022"
dimension = "environment"
licence = "OGL-3.0"
licence_url = "https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/"
commercial_use = "yes"
share_alike = false
attribution = "Contains public sector information licensed under the Open Government Licence v3.0."
attribution_verified = false
conditions = [
    "Land use only. A figure describes land, and never who lives on it or near it.",
    "Never build a measure from Communal accommodation (Q), Community buildings (C) or Defence buildings (D). The technical notes give the first as hostels, old people's homes, children's homes, monasteries and convents, and put religious buildings and prisons under the second and barracks under the third. Each says something of who lives on the land. They are read only to add up all the land of an LSOA.",
    "Build a measure from a category, never from a group. The group 'Industry and commerce' holds Industry, Offices, Retail, and Storage and warehousing, so its total counts offices and shops. The group 'Transport and utilities' holds Highways and roads beside Transport (other).",
    "Name a measure for what its category holds, as the technical notes define it. Transport (other) is railways, airports and dockland. Depots and yards are in Storage and warehousing.",
    "Show beside every figure the period its receipt states, and no other. The workbook states the year 2022 and no month, in the title of each sheet. The release says 'As at April 2022', and the technical notes say the dates of the products behind the figures centre around April 2021: neither is in the workbook, so no month is shown. The technical notes say the figures are estimates, so say that too.",
    "This entry covers the 2022 edition alone. Do not show change over time: the technical notes say the way the land use data is overlaid on other boundaries changed after the 2018 edition.",
    "The publisher plans a new series for 2024 to 2026, under Ordnance Survey's own classes of land and not these 28, and says its figures should not be compared with those published up to 2022. It is another table. Register it as an entry of its own when it is published, and never read it with the step written for 2022.",
    "The release says the figures are derived from Ordnance Survey's AddressBase, Open Greenspace and MasterMap Topography products. Use the published table only. Never ask for or use those products.",
    "Whenever the workbook is fetched again as other bytes, read its words for any statement of Ordnance Survey's rights, or of any term beside the Open Government Licence, and save what it says to registry/evidence. If it states a term that limits reuse, stop and change this entry to gated. The workbook fetched on 2026-09-24 states none: registry/evidence holds what it says.",
    "A dash stands in some cells of figures, and the workbook does not say what for. Read it as none of that land only where the figures of its row add up to the row's grand total, which the second note under each table says is the sum of all the categories. Never read a dash as nought anywhere else.",
    "A measure from this table has its row of the proxy audit written before it joins a release that is served (ADR 0006).",
]
status = "approved"
before_launch = [
    "A person opens the workbook once and looks for any statement of Ordnance Survey's rights. The page states the Open Government Licence 'except where otherwise stated'. A program read every row of the workbook that holds words alone on 2026-09-24, and found no such statement and no term of use. No person has opened it.",
]
uses = ["scoring", "display"]
cadence = "Irregular. Editions for 2017 to 2022. The 2022 edition was published on 27 October 2022, and the editions for 2019, 2020 and 2021 on 24 August 2023. No later edition was on the collection page, or in the publisher's own search, on 2026-09-24. A consultation the publisher opened on 16 September 2026 says land use in England was 'Last published for 2022', and that it plans 'to resume publication of the land use statistics this year (2026), with the first tranche of releases covering the years 2024 to 2026'. Its timetable gives land use stock for 2024, 2025 and 2026 'By end of 2026', and each later release 'Annual, in October each year'. The new series is to rest on Ordnance Survey's National Geographic Database and on Ordnance Survey's own classes of land, and is to be broken down by MSOA and LSOA. The consultation closes on 28 October 2026, so none of this is settled."
verified_how = "primary_source"
verified_on = 2026-09-24
evidence_urls = [
    "https://www.gov.uk/government/statistics/land-use-in-england-2022",
    "https://www.gov.uk/government/statistics/land-use-in-england-2022/land-use-statistics-england-2022",
    "https://www.gov.uk/government/collections/land-use-in-england",
    "https://www.gov.uk/government/consultations/land-use-statistics-in-england-methodology-changes/land-use-statistics-in-england-methodology-changes",
    "https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/",
    "https://assets.publishing.service.gov.uk/media/63595b6ed3bf7f0bd5cea49d/Land_Use_and_Land_Use_Change_-_Technical_Notes.pdf",
]
file_urls = [
    "https://assets.publishing.service.gov.uk/media/6356f96ce90e0777a7af42af/Live_Tables_-_Land_Use_Stock_2022_-_LSOA.ods",
]
notes = "How it was verified: on 2026-09-24 the release page, the statistical release and the collection page were each read through a reader that extracts, which was asked twice of each, in different words. Both readings of the release page gave the same licence line, 'All content is available under the Open Government Licence v3.0, except where otherwise stated', and the same address for each file, letter for letter. Both readings of the statistical release gave '© Crown copyright 2022. This publication is licensed under the terms of the Open Government Licence v3.0 except where otherwise stated', and 'As at April 2022'. The technical notes, a PDF of 18 pages that the release page lists, were read as text: they say the information may be re-used 'free of charge in any format or medium, under the terms of the Open Government Licence'. The licence was read the same day: it allows a person to 'exploit the Information commercially', and gives the attribution above for a provider that states none. No page read states an attribution of its own, so the wording is the licence's, and it is not verified: the workbook, read since, states none either. The release page lists the file as 'Land use statistics: England 2022 - live tables by LSOA and MSOA', ODS, 36.4 MB. The statistical release says the figures are at LSOA level in Live Table P405. No page says which census the LSOA codes follow, what unit the table is in, or how its sheets and columns are named: the step that reads it finds each in the file and stops where it cannot. The technical notes name 28 categories in 13 groups, and define each. Their second note says the dates of the products the figures rest on were 'chosen to centre around April 2021', where the release says April 2022: the list of files named the period as not yet sure for that reason, until the workbook was read for its own date, which is the year 2022. The release page also lists the national live tables, ODS, 2.32 MB, which hold no figure below a local authority or a constituency and are not taken. The consultation 'Land use statistics in England: methodology changes', which the publisher's own search gives when it is asked for the newest first, was read the same day, twice, in different words: both readings gave the same sentences on when publication resumes, on the classes of land and on the break in the series, as the cadence above quotes them. It is evidence of what the publisher plans, and of nothing in the table of 2022. Filed under environment, beside the other measures of land. The last address under evidence_urls is the technical notes, on the host GOV.UK hands out files from. It is evidence of the definitions and of the licence line it prints, and is no file of data. No file of data was fetched or opened to write this entry as it first stood. The workbook was fetched on 2026-09-24, f-b8db326abd8b, and read that day with the step describe, which gives each row of a sheet that holds words alone and no row that holds a number. It holds two sheets, one in per cent and one in hectares, and no cover and no sheet of notes. Its titles state the year 2022. Two notes stand under each table: that the data is mapped to the LSOA boundaries of 2021 at the mean high tide mark, and that the grand total is the sum of all the categories. It states no licence, no copyright, no attribution, no right of Ordnance Survey's and no term of use, so nothing in it is 'otherwise stated'. registry/evidence/mhclg-land-use-statistics-2022-2026-09-24.md holds what was read and how."

[[source]]
id = "gla-green-cover-2024"
name = "Green Cover 2024"
publisher = "Greater London Authority"
url = "https://data.london.gov.uk/dataset/green-cover-2024-e56n0"
dimension = "environment"
licence = "Bespoke-terms"
commercial_use = "yes_with_conditions"
share_alike = false
attribution = "Green Cover 2024: Greater London Authority, used with permission."
attribution_verified = false
conditions = [
    "Permission in writing, as the founder reports. The founder asked the GLA's GIS team to use the Tree Canopy Cover 2024 and Green Cover 2024 layers in a commercial service, to measure how leafy an area is. The founder reports that the team answered in writing on 2026-09-23, giving permission.",
    "The permission covers what was asked and no more. A figure for an area only: never the cover of one home, garden or street. The layer itself is never shown and never passed on.",
    "A change of use means asking the GLA again, before the change is made.",
    "Credit the Greater London Authority wherever a figure from the layer is shown. The credit is Burro's wording until the owner publishes its own.",
    "The dataset page shows 'All Rights Reserved', so the reply is the only ground for use. An owner can give only the rights it holds. The page says the layer was made from aerial imagery and height data, and names the Ordnance Survey MasterMap Topography Layer. Whether the reply speaks of those is not recorded: the founder checks it in the reply.",
    "London Datastore terms apply to every GLA dataset: state that the Greater London Authority cannot warrant the quality or accuracy of the data, and never imply GLA endorsement, affiliation, support or approval.",
    "Say the date of the imagery wherever a figure appears. The research records it as mostly 2022.",
]
status = "gated"
status_reason = "The dataset page shows 'Licence: All Rights Reserved', so the permission rests on a written reply that only the founder has read. The founder holds the reply. What would settle it: the founder files a dated note of the reply in registry/evidence."
uses = ["scoring"]
cadence = "One off, as the dataset page says."
verified_how = "secondary_source"
verified_on = 2026-09-23
evidence_urls = ["https://data.london.gov.uk/dataset/green-cover-2024-e56n0"]
notes = "What the founder reported is noted in registry/evidence/gla-green-cover-2024-2026-09-23.md. The dataset page was read on 2026-09-23 through a reader that extracts, which is not the page itself. As read: the licence is 'All Rights Reserved', the maintainer is 'GLA GIS', and no credit wording is given. The research opened the page in a browser the same day and records the same licence. The attribution is Burro's own wording, not the GLA's. verified_how is secondary_source because whoever wrote this entry has not read the reply, and so that the entry cannot be approved by changing its status alone. No file was opened. The research records 2 km tiles of polygons, and tables by ward and borough."

