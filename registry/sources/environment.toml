[[source]]
id = "gla-green-cover-2024"
name = "Green Cover 2024"
publisher = "Greater London Authority"
url = "https://data.london.gov.uk/dataset/green-cover-2024-e56n0"
dimension = "environment"
licence = "Bespoke-terms"
commercial_use = "yes_with_conditions"
share_alike = false
attribution = "Green Cover 2024: Greater London Authority, used with permission."
attribution_verified = false
conditions = [
    "Permission in writing, as the founder reports. The founder asked the GLA's GIS team to use the Tree Canopy Cover 2024 and Green Cover 2024 layers in a commercial service, to measure how leafy an area is. The founder reports that the team answered in writing on 2026-09-23, giving permission.",
    "The permission covers what was asked and no more. A figure for an area only: never the cover of one home, garden or street. The layer itself is never shown and never passed on.",
    "A change of use means asking the GLA again, before the change is made.",
    "Credit the Greater London Authority wherever a figure from the layer is shown. The credit is Burro's wording until the owner publishes its own.",
    "The dataset page shows 'All Rights Reserved', so the reply is the only ground for use. An owner can give only the rights it holds. The page says the layer was made from aerial imagery and height data, and names the Ordnance Survey MasterMap Topography Layer. Whether the reply speaks of those is not recorded: the founder checks it in the reply.",
    "London Datastore terms apply to every GLA dataset: state that the Greater London Authority cannot warrant the quality or accuracy of the data, and never imply GLA endorsement, affiliation, support or approval.",
    "Say the date of the imagery wherever a figure appears. The research records it as mostly 2022.",
]
status = "gated"
status_reason = "The dataset page shows 'Licence: All Rights Reserved', so the permission rests on a written reply that only the founder has read. The founder holds the reply. What would settle it: the founder files a dated note of the reply in registry/evidence."
uses = ["scoring"]
cadence = "One off, as the dataset page says."
verified_how = "secondary_source"
verified_on = 2026-09-23
evidence_urls = ["https://data.london.gov.uk/dataset/green-cover-2024-e56n0"]
notes = "What the founder reported is noted in registry/evidence/gla-green-cover-2024-2026-09-23.md. The dataset page was read on 2026-09-23 through a reader that extracts, which is not the page itself. As read: the licence is 'All Rights Reserved', the maintainer is 'GLA GIS', and no credit wording is given. The research opened the page in a browser the same day and records the same licence. The attribution is Burro's own wording, not the GLA's. verified_how is secondary_source because whoever wrote this entry has not read the reply, and so that the entry cannot be approved by changing its status alone. No file was opened. The research records 2 km tiles of polygons, and tables by ward and borough."

