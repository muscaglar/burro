status_reason = "The licence is confirmed (ODbL 1.0) and internal use is outside share-alike under ODbL 4.5. The risk is contamination of the gazetteer, which is the product's core asset. The written policy now exists as ADR 0004. Gate still open: a CI lineage test that fails if any gazetteer, cell, destination-search or feature table reads from an OSM table. Approve for validation_only once that test is merged."
