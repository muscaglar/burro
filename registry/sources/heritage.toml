notes = "How it was verified: OGL v3 and the attribution statement are shown on the planning.data.gov.uk dataset page, and Historic England's own data.gov.uk record also says OGL. Both fetched by the drafter and again by this review on 2026-09-23. 382,270 records. The attribution was put right on 2026-09-24: the entry held the first two sentences of the statement, and the page holds four. The dataset page was read three times that day through a reader that extracts, asked in different words each time, and gave the same statement each time, letter for letter. The last sentence ends with no full stop on the page. It is the same statement the conservation area page shows. That is still an extraction, so attribution_verified stays false until a person has read the statement on the page in a browser. The statement asks for the date the data was obtained, which is the day the file was retrieved. Historic England's own terms have not been read. What the file held on 2026-09-24: 381,754 records, all from one provider, of which 379,159 are points and live and carry a grade, and 2,595 are outlines that have ended. docs/research/data/heritage.md says what was read and counted."

