id = "mhclg-planning-data-conservation-areas"
name = "Conservation area boundaries"
publisher = "Ministry of Housing, Communities and Local Government (Planning Data platform), with data from Historic England and local planning authorities"
url = "https://www.planning.data.gov.uk/dataset/conservation-area"
dimension = "heritage"
licence = "OGL-3.0"
licence_url = "https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/"
commercial_use = "yes_with_conditions"
share_alike = false
attribution = "© Historic England 2026. Contains Ordnance Survey data © Crown copyright and database right 2026. The Historic England GIS Data contained in this material was obtained on [date]. The most publicly available up to date Historic England GIS Data can be obtained from HistoricEngland.org.uk"
attribution_verified = false
conditions = [
    "The publisher says the data 'may be incomplete and not yet cover all of England' and 'contains a number of duplicate conservation areas'. De-duplicate at ingest and treat missing coverage as unknown, not zero.",
    "The page says it 'contains some data created by MHCLG' that is being replaced with authoritative sources. Keep the per-record provider so such records can be told apart.",
    "Check coverage for all 33 London authorities before the historic character tag relies on it.",
    "Never let this source decide a tag alone; combine with listed building density and pre-1919 dwelling share.",
    "Update the year in the statement to match the data used.",
    "Replace [date] in the statement with the day the file was retrieved, as its receipt gives it.",
    "Never read the name of a record, or its notes.",
]
status = "approved"
uses = ["scoring"]
cadence = "Collector runs daily. Last updated 2026-09-23."
verified_how = "primary_source"
verified_on = 2026-09-23
evidence_urls = [
    "https://www.planning.data.gov.uk/dataset/conservation-area",
    "https://www.planning.data.gov.uk/about/",
]
# The address of the file, as a person read it on the dataset page in a browser on
# 2026-09-24: the page's own link to the GeoJSON points to this host.
file_urls = [
    "https://files.planning.data.gov.uk/dataset/conservation-area.geojson",
]
notes = "How it was verified: OGL v3 and the attribution statement are shown on the dataset page. Confirmed by the verifier, by the drafter and again by this review on 2026-09-23. 10,953 records for England from 151 data providers. The platform's about page says it is built by the Ministry of Housing, Communities and Local Government. The attribution was put right on 2026-09-24: the entry held the first two sentences of the statement, and the page holds four. The dataset page was read three times that day through a reader that extracts, asked in different words each time, and gave the same statement each time, letter for letter. The last sentence ends with no full stop on the page. That is still an extraction, so attribution_verified stays false until a person has read the statement on the page in a browser. The page gives Historic England's statement for the whole dataset, though many records are an authority's own. Coverage of the 33 London authorities was checked on 2026-09-24 in the file of that day: every one holds most of 4 conservation areas or more, and 14 rest wholly on records of quality some. Neither the file nor the page says what that quality means. No count was held against an authority's own list. The GeoJSON holds 9,659 records, which is 1,294 fewer than the page gives: what the others are is not known. docs/research/data/heritage.md has the count of each authority."

