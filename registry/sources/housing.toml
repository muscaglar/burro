[[source]]
id = "ons-access-to-garden-space-2020"
name = "Access to garden space, Great Britain, April 2020 (private outdoor space reference tables)"
publisher = "Office for National Statistics, from an analysis by Ordnance Survey"
url = "https://www.ons.gov.uk/economy/environmentalaccounts/datasets/accesstogardensandpublicgreenspaceingreatbritain"
dimension = "housing"
licence = "OGL-3.0"
licence_url = "https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/"
commercial_use = "yes"
share_alike = false
attribution = "Contains public sector information licensed under the Open Government Licence v3.0.\nSource: Ordnance Survey\n© Crown copyright and database rights 2020 OS 100019153"
attribution_verified = false
conditions = [
    "This entry covers one workbook, the edition the page calls 'Access to garden space, Great Britain, April 2020'. The same page offers two more. 'Access to garden space, England, 2014 to 2019' is a survey of people, broken down by age and ethnic group: it describes residents, and is never fetched, read or registered for scoring. 'Access to public parks and playing fields, Great Britain, April 2020' is another table, and needs an entry of its own before it is read.",
    "Read the rows of areas, and of each the count of addresses and the count of addresses with private outdoor space. A figure describes homes and the ground beside them, and never who lives in them.",
    "Say 'addresses' and not 'homes' or 'households' wherever a figure is named: no page says what Ordnance Survey counted as an address, and the council tax lists count homes another way.",
    "Show beside every figure that it is as at April 2020. It is one analysis and not a series: the page gives the next release as 'To be announced', and no later edition was on it on 2026-09-24.",
    "Neither a page nor the workbook says which census the codes of the areas follow, and the codes are not those of 2021. Give no figure to an area the workbook holds no row for, and share nothing out to one. Before a figure is carried, hold each area to the statistics office's own lookup from the MSOAs of 2011 to those of 2021, ons-msoa11-msoa21-lad22-lookup. Never map one to the other by any other means.",
    "The publisher says Ordnance Survey provided the data 'as part of its mapping for emergencies service'. Use the published table only. Never ask for or use the products of Ordnance Survey behind it.",
    "The notes of the workbook were read at first ingest, and what they say of Ordnance Survey's rights is saved in registry/evidence/ons-access-to-garden-space-2020-2026-09-24.md. They state rights and a licence number, and no term of use. Read them again in any file that takes this one's place. If one states a term that limits reuse, stop and change this entry to gated.",
    "Show the two lines of Ordnance Survey's credit as the workbook words them, beside the line of the licence.",
    "A measure from this table has its row of the proxy audit written before it joins a release that is served (ADR 0006). The design of the vibes holds private outdoor space out of Homes and out of likeness until that row passes, and the publisher's own article reports, from a survey, that access to a garden differs by ethnic group, by age and by occupation.",
    "Do not suggest the Office for National Statistics or Ordnance Survey endorses Burro.",
]
status = "approved"
before_launch = [
    "The founder decides whether the workbook's line of rights is something 'otherwise stated'. The page states the Open Government Licence 'except where otherwise stated'. The workbook states '© Crown copyright and database rights 2020 OS 100019153', which names a licence number of Ordnance Survey and no licence of the table. No person has read the workbook: a program did.",
    "The statistics office's lookup from the MSOAs of 2011 to those of 2021, ons-msoa11-msoa21-lad22-lookup, fetched and read, and each area that has a figure held to its mark of no change, before a figure of this table is carried.",
    "The row of the proxy audit for private outdoor space, as ADR 0006 and the design of the vibes ask.",
]
uses = ["scoring", "display"]
cadence = "One-off. Released 14 May 2020, as at April 2020. Corrected 20 May 2022. Next release 'To be announced'. No later edition was on the page on 2026-09-24."
verified_how = "primary_source"
verified_on = 2026-09-24
evidence_urls = [
    "https://www.ons.gov.uk/economy/environmentalaccounts/datasets/accesstogardensandpublicgreenspaceingreatbritain",
    "https://www.ons.gov.uk/help/termsandconditions",
    "https://www.ons.gov.uk/economy/environmentalaccounts/articles/oneineightbritishhouseholdshasnogarden/2020-05-14",
    "https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/",
]
file_urls = [
    "https://www.ons.gov.uk/file?uri=/economy/environmentalaccounts/datasets/accesstogardensandpublicgreenspaceingreatbritain/accesstogardenspacegreatbritainapril2020/osprivateoutdoorspacereferencetables.xlsx",
]
notes = "How it was verified: on 2026-09-24 the dataset page, the publisher's terms and conditions, the article the dataset was published with and the licence were each read through a reader that extracts, and the first three were asked at least twice, in different words. Both readings of the dataset page gave the licence line of its footer, 'All content is available under the Open Government Licence v3.0', one of them with the words 'except where otherwise stated'. Both readings of the terms and conditions gave 'Most content on this website is subject to Crown copyright protection and is published under the Open Government Licence (OGL)', and gave as what is not covered 'some photographs, illustrations and videos'. The licence was read once: it allows a person to 'exploit the Information commercially and non-commercially', gives the attribution above for a provider that states none, and does not cover 'third party rights the Information Provider is not authorised to license'. No page read states an attribution for this dataset, so the wording is the licence's, and it is not verified until the workbook's notes are read. The dataset page gives the release date as 14 May 2020 and the next release as 'To be announced', and says the analysis is 'available by country, region, Local Authority and Middle Layer Super Output Area'. It lists the workbook as xlsx, 3.0 MB. Both readings gave the same path for it, letter for letter. One gave it as a path from the top of the site and the other on a host named cdn, so the address here is the path on the page's own host, as the other entries of this publisher write theirs, and the list names the address as not yet sure. The page's corrections, as one reading gave them: on 20 May 2022 the estimates for countries were corrected, where Scotland and Wales had been mislabelled, and on 18 May 2020 the layout of the tables was changed and no figure moved. Neither is said of the rows of an MSOA. The article says Ordnance Survey 'has provided us with data on access by geographic areas of Great Britain, as part of its mapping for emergencies service'. No page read says what counts as private outdoor space, how a garden that flats share is counted, what the sheets and columns of the workbook are called, or which census the codes follow: each is to be read in the file. The methodology page the article links to is of the survey of people alone, and says nothing of the table. Filed under housing, beside the other measures of homes. It is not the modelled score of outdoor space in the Indices of Deprivation, which the design of the vibes first named for this measure and which the entry of those indicators does not allow. No file of data was fetched or opened to write this entry. What was read since, in the workbook as it was stored, on 2026-09-24, by a program and by no person: its sheet of notes is headed 'Private outdoor space data' and 'Great Britain', and says 'Aggregated data based upon UPRN-level dataset providing private outdoor space estimates for 28,818,909 residential address records from epoch 74 of OS AddressBase Plus.' It names the four kinds of area the page names. It says 'Source: Ordnance Survey' and '© Crown copyright and database rights 2020 OS 100019153', and so does the foot of every sheet of figures. It states no licence, no term of use, no month and no census. The attribution above holds those two lines as written. It is not marked as verified, because the statistics office states no wording of its own for this dataset, and the first line is the licence's. The sheet of MSOAs counts houses, flats and both, and names a column for the average number of flats that share a garden, so a garden that flats share is counted. It gives no definition of private outdoor space. It holds 8,480 areas, and its codes are not those of 2021: of London's 1,002 areas of 2021 it holds 963. The lookup the statistics office gives between the two is 'MSOA (2011) to MSOA (2021) to Local Authority District (2022) Exact Fit Lookup for EW (V2)'. Its record on data.gov.uk was read twice on 2026-09-24, through a reader that extracts. Both readings gave the same marks: U for no change from 2011 to 2021, S for an area of 2011 split into two or more, M for areas of 2011 merged into one, and X where the two do not fit. The record gives its licence as 'Not set', so it is no evidence of a licence. The lookup has since been registered as ons-msoa11-msoa21-lad22-lookup, on its item's own record and the publisher's page of licences. No file of it has been fetched."

