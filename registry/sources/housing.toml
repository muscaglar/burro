attribution = "Source: PropertyData"
attribution_verified = false
conditions = [
    "Permitted: use 'for any lawful purpose, commercial or non-commercial', including 'using the API inside a customer-facing product, including a paid, multi-tenant software-as-a-service product'.",
    "The terms speak of 'displaying our data to your own users inside such a product, including to paying customers of a subscription product of your own'. They do not say whether public pages that need no login count. It is an open question for PropertyData.",
    "Not permitted: 'republishing our data, or a substantial part of it, as a dataset, download, feed or API of your own', 'building a searchable copy of our data that other people can query instead of subscribing to us', 'presenting our data as your own original dataset', or sharing the account or API key.",
    "60-day rule: 'You may store what an API call returns for up to 60 days from the moment you retrieved it. At the end of the 60 days you must either delete that stored copy or replace it by making a fresh call.' No longer period is offered on any plan.",
    "May be kept indefinitely if never presented as current: dated snapshots, reports already produced, 'aggregate figures you calculate, such as averages, ranges, benchmarks and indices, and anything you publish from them', and 'your own scores, classifications and derived attributes'.",
    "Anything kept longer than 60 days 'must be clearly marked as a historical observation and show the date it was retrieved' and 'must not be used to answer a question about the present'. So an 'asking rent if you move in now' figure must rest on calls made within the last 60 days.",
    "When access ends: 'each piece of data you have already retrieved reaches the end of its 60 days as normal and must then be deleted'. Historical records and derived material may be kept but not used to present current information.",
    "'Screenshots, extracts and PDF downloads must not be altered, and must acknowledge PropertyData as the source.'",
    "No rights are granted in listing photographs. Do not display, hotlink, copy, store or thumbnail them.",
    "The API returns forwarding links to listings. The terms allow showing them, but PLAN section 15 rules out linking to property listings. Do not show them.",
    "The free trial key is for development and testing only, not production.",
    "Asking data comes from 'Property listings seen on rightmove.co.uk, zoopla.co.uk and onthemarket.com'. That provenance is outside Burro's control.",
]
status = "held"
status_reason = "Not used in v1. PLAN section 7 lists PropertyData under 'Held out until cleared', and open decision 11 defers a paid asking-rent source to the end of phase 1. The terms (updated August 2026) were read and do allow use in a customer-facing product. Clears when it is settled whether blended estimates may appear on public, unauthenticated pages, and the founder takes decision 11."
verified_how = "primary_source"
verified_on = 2026-09-23
evidence_urls = [
    "https://propertydata.co.uk/terms",
    "https://propertydata.co.uk/api/pricing",
]

