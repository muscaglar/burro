    "Use as a dated snapshot only. Show the period it covers beside any figure that depends on it.",
    "Use only as a model input for rent variation within a borough. Never display raw district medians. The housing report records the workbook's own caveat that the figures 'should not be compared across time periods or between areas' and are not comparable with the Price Index of Private Rents.",
    "The release page states: 'It must be noted that no attempt has been made to account for the change in quality of composition of rented property in these statistics, so should be interpreted with caution.' Say so on the methods page. Say the same of the caveat against comparing areas. At first ingest, read the caveat in the workbook's notes sheet and save it in registry/evidence.",
