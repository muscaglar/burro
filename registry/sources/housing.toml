notes = "How it was verified: verify-data-licences.md confirms CTSOP3.1 (property type) and CTSOP4.1 (build period) are published at LSOA level under OGL v3.0. The publisher page shows the OGL v3.0 footer and lists CTSOP1.1 for local authority and super output areas. Commercial use is allowed with attribution. Ingest can start. The attribution wording must be checked in the workbooks before launch. Checked 2026-09-23. No VOA-specific attribution statement is on the page, so the attribution is the default statement the OGL requires when the provider gives none. It is marked unverified because the workbooks were not opened. The housing report says the tables include number of bedrooms, but no bedroom table is listed on the 2025 page; use Census 2021 TS050 for bedrooms. CTSOP1.1 was confirmed on the publisher page by the reviewer, not in verify-data-licences.md. The VOA rating list is a different dataset and is banned: see voa-non-domestic-rating-list. The last three addresses under evidence_urls, on assets.publishing.service.gov.uk, are the three files themselves, as the publisher's page listed them on 2026-09-23. It was read through a reader that extracts, which was asked twice, in different words, and gave the same addresses both times. GOV.UK hands out files from that host, which has no pages of its own, so an entry can name it only by a file. They are there to name the host the files are on. Fetch holds a file to the addresses under file_urls. They are no evidence of the licence. No file was fetched. A file that is reissued is given a new address."

