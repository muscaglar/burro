[[source]]
id = "ons-median-house-prices-msoa"
name = "Median house prices by Middle layer Super Output Area (formerly HPSSA dataset 2)"
publisher = "Office for National Statistics"
url = "https://www.ons.gov.uk/peoplepopulationandcommunity/housing/datasets/medianhousepricesbymiddlelayersuperoutputarea"
dimension = "housing"
licence = "OGL-3.0"
licence_url = "https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/"
commercial_use = "yes"
share_alike = false
attribution = "Source: Office for National Statistics. These statistics were adapted from data from the HM Land Registry licensed under the Open Government Licence v.3.0."
attribution_verified = true
conditions = [
    "Show a figure as what it is: the median of what was paid for the homes of one kind that were sold in the area in the year, of all sizes. The workbook gives no price by bedrooms, so none is shown and none is worked out by scaling.",
    "Show the year of sales beside every figure. The workbook holds a column for each year that ends with a quarter, and one is read: the year the receipt of the file gives.",
    "Where the workbook holds [x] it gives no figure: its cover says there were no sales, or fewer than five, of that kind of home in the year. Show no figure there, and never nought. Do not try to recover a figure that was withheld.",
    "The workbook gives no count of the sales behind a figure, and no quartile. Show no range, and say that the publisher gives no count. A figure may rest on as few as five sales.",
    "Carry the figure as the workbook writes it. Do not round it, index it to another month, or blend it with another source under this entry.",
    "A price says what homes sold for. It is no verdict on a place or on who lives there, and no tag or vibe rests on it unless a person asks for it (ADR 0006, ADR 0021).",
    "Read the five sheets of all homes alone: 1a to 1e. The sheets of newly built and of existing homes are not covered by this entry.",
    "Credit both the Office for National Statistics and HM Land Registry wherever a figure is shown, in the words under attribution, and link to the Open Government Licence.",
    "Do not suggest the Office for National Statistics or HM Land Registry endorses Burro.",
]
status = "approved"
uses = ["scoring", "display", "validation_only"]
cadence = "About twice a year. Latest edition 17 September 2026 (year ending March 2026); next release March 2027."
verified_how = "primary_source"
verified_on = 2026-09-24
evidence_urls = [
    "https://www.ons.gov.uk/peoplepopulationandcommunity/housing/datasets/medianhousepricesbymiddlelayersuperoutputarea",
    "https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/",
    "https://www.ons.gov.uk/help/termsandconditions",
]
file_urls = [
    "https://www.ons.gov.uk/file?uri=/peoplepopulationandcommunity/housing/datasets/medianhousepricesbymiddlelayersuperoutputarea/yearendingmarch2026/medianpricepaidformsoa.xlsx",
]
notes = "The founder decided on 24 September 2026 that what a home sells for may be shown, so the entry gained the uses scoring and display that day (ADR 0021). Until then it was held for validation only. How it was verified, on 2026-09-24: the dataset page states 'All content is available under the Open Government Licence v3.0, except where otherwise stated', and states nothing otherwise of this dataset. The licence page lets a user 'exploit the Information commercially and non-commercially for example, by combining it with other Information, or by including it in your own product or application', and asks that the source be acknowledged 'by including or linking to any attribution statement specified by the Information Provider(s)'. Both pages were read through a reader that summarises, which was asked for the words and gave these. The attribution was read from the workbook itself, as text, from the file whose receipt is f-545982134c5e: its cover says, under Reproduction, 'You may re-use this information (not including logos) free of charge in any format or medium, under the terms of the Open Government Licence', then 'These statistics were adapted from data from the HM Land Registry licensed under the Open Government Licence v.3.0. Users should include a source accreditation to ONS - Source: Office for National Statistics.', and under Notes 'Source: Office for National Statistics, HM Land Registry.' The attribution here is the accreditation the cover asks for, followed by its sentence on HM Land Registry, each as printed. registry/evidence/ons-median-house-prices-msoa-2026-09-24.md holds what was read and how. The dataset page gives no attribution wording of its own, and does not name HM Land Registry. The licence does not cover personal data or third party rights: the workbook holds a figure for an area of some thousands of homes, and no address, postcode or sale. MSOAs are the areas of a preview build. When areas are drawn by hand no sheet holds a row for one, and the figure must then be worked out from sales under hmlr-price-paid, which has its own conditions. The file stays registered for validation_only too: it was first fetched under that use, and it is still the test of medians that Burro works out for itself. The terms page of the publisher's website says that most content is Crown copyright and is published under the Open Government Licence, and that permission is needed to say a website is associated with or endorsed by the publisher. The page on licences for geography products, which the entry cited before, covers boundaries and lookups and gives no wording for statistics, so it is no longer cited. The LSOA equivalents were last released in September 2023 and are not covered by this entry."

