dimension = "housing"
licence = "OGL-3.0"
additional_licences = ["Bespoke-terms"]
licence_url = "https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/"
commercial_use = "yes_with_conditions"
share_alike = false
attribution = "Contains HM Land Registry data © Crown copyright and database right 2021. This data is licensed under the Open Government Licence v3.0."
attribution_verified = false
conditions = [
    "The publisher states: 'Under the OGL, HM Land Registry permits you to use the Price Paid Data for commercial or non-commercial purposes. However, OGL does not cover the use of third party rights, which we are not authorised to license.'",
    "Address Data is not plain OGL. The publisher lists it as Postcode, PAON, SAON, Street, Locality, Town/City, District and County. Royal Mail and Ordnance Survey permit its use only 'for personal and/or non-commercial use' or 'to display for the purpose of providing residential property price information services'. Any other use: 'you must contact Royal Mail' (address.management@royalmail.com). This is the Bespoke-terms entry in additional_licences.",
    "Postcode is itself Address Data, so dropping the other columns does not remove the condition. Burro relies on the second permitted use (residential property price information service).",
    "Burro uses postcode in two ways: to aggregate sale prices to neighbourhoods, and to build the flat-price ratio that feeds the rent model. The second is one step further from the permitted wording. A question put to HM Land Registry must name both uses.",
    "Drop PAON, SAON, Street, Locality, Town/City, District and County at ingest. Keep postcode only as a join key for aggregation to neighbourhoods.",
    "Never display, export or serve postcode-level or transaction-level rows. Only neighbourhood aggregates leave the pipeline.",
    "The OGL does not cover personal data. Transaction rows identify individual homes, so they stay inside the pipeline.",
    "Do not suggest HM Land Registry endorses Burro (OGL non-endorsement clause).",
    "The publisher says separate licence conditions apply to the UPRN and INSPIRE ID lookup tables. They are not covered by this entry.",
    "A test must prove that no postcode-level or transaction-level row reaches a data release, an API response or an export.",
]
status = "approved"
before_launch = [
    "HM Land Registry's written reply, or a decision record, on using the postcode field to aggregate sale prices to neighbourhoods and to build the flat-price ratio in the rent model.",
]
uses = ["scoring", "display"]
cadence = "Monthly, on the 20th working day. Latest month July 2026; page updated 28 August 2026."
verified_how = "primary_source"
verified_on = 2026-09-23
evidence_urls = [
    "https://www.gov.uk/government/statistical-data-sets/price-paid-data-downloads",
    "https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/",
]
notes = "OGL v3.0 and the attribution wording were confirmed on the publisher's page on 2026-09-23. The use of postcode rests on the permitted purpose of providing residential property price information services."

