[[source]]
id = "openstreetmap-points-of-interest"
name = "OpenStreetMap points of interest (Greater London extract)"
publisher = "OpenStreetMap contributors, OpenStreetMap Foundation"
url = "https://download.geofabrik.de/europe/united-kingdom/england/greater-london.html"
dimension = "places"
licence = "ODbL-1.0"
licence_url = "https://www.openstreetmap.org/copyright"
commercial_use = "yes_with_conditions"
share_alike = true
attribution = "© OpenStreetMap contributors"
attribution_verified = false
conditions = [
    "Internal benchmarking only, producing aggregate quality metrics.",
    "OSM comparison may set a global threshold. It must never drop, add or correct an individual Overture, FSA or gazetteer record. The OSMF Horizontal Layers guideline lists adding non-OSM data based on comparison with OpenStreetMap data as a case where share-alike applies.",
    "Never an input to scoring, tags, gazetteer, cells or destination search.",
    "Keep in its own schema, linked to other data by key only.",
    "Repeated small extractions count as one large extraction.",
    "If the credit is ever shown, link it to https://www.openstreetmap.org/copyright so the Open Database Licence is clear.",
]
status = "gated"
status_reason = "Licence is confirmed, but the risk is leakage into scoring. The written policy now exists (ADR 0004 and rule 3 in AGENTS.md) and the registry refuses share-alike sources for scoring. Gate: a CI lineage test that fails when any feature or gazetteer table depends on the OSM extract. It does not exist yet."
cadence = "Daily extracts. Pin the extract date."
verified_how = "primary_source"
verified_on = 2026-09-23
evidence_urls = [
    "https://www.openstreetmap.org/copyright",
    "https://osmfoundation.org/wiki/Licence/Attribution_Guidelines",
    "https://osmfoundation.org/wiki/Licence/Community_Guidelines/Horizontal_Map_Layers_-_Guideline",
    "https://opendatacommons.org/licenses/odbl/1-0/",
]
notes = "Covers points of interest only. OSM for the basemap and the routing street network belongs in separate entries. The OSMF Attribution Guidelines accept 'OpenStreetMap', '© OpenStreetMap contributors' and '© OpenStreetMap'. Internal use that is never shown publicly triggers no attribution, but the credit is recorded for the methods page. The Geofabrik page shows 'ODbL 1.0' and data up to 2026-09-22. Intended use once the gate passes: validation_only."

[[source]]
id = "parkrun-events"
name = "parkrun and junior parkrun events in London: location and day"
publisher = "parkrun"
url = "https://www.parkrun.org.uk/"
dimension = "places"
licence = "Bespoke-terms"
commercial_use = "yes_with_conditions"
share_alike = false
attribution = "Event locations and days: parkrun, used with permission."
attribution_verified = false
conditions = [
    "Permission in writing, as the founder reports. The founder asked parkrun to use the location and day of each parkrun and junior parkrun event in London in a commercial service, as one kind of place in a vibe about places to meet, and to show the event's name. The founder reports that parkrun answered in writing on 2026-09-23, giving permission.",
    "The permission covers what was asked and no more. Never results, times or attendance, and nothing about a runner or a volunteer.",
    "A change of use means asking parkrun again, before the change is made: another field, another area, another purpose, or passing the data on.",
    "Credit parkrun wherever an event is counted or named. The credit is Burro's wording until the owner publishes its own.",
    "How the events are to be obtained is not recorded. Until parkrun has said how, no page of its site is fetched by code.",
    "An event is a place to meet. It is never used to say who lives near it.",
]
status = "gated"
status_reason = "The permission is a written reply that only the founder has read. The founder holds the reply. No published licence stands behind this source: nobody has read parkrun's terms. What would settle it: the founder files a dated note of the reply in registry/evidence."
uses = ["scoring", "display"]
verified_how = "secondary_source"
verified_on = 2026-09-23
notes = "What the founder reported is noted in registry/evidence/parkrun-events-2026-09-23.md. No page of parkrun's site was read for this entry. The address above is the one the research recorded, and nobody has opened it. The attribution is Burro's own wording, not parkrun's. verified_how is secondary_source because whoever wrote this entry has not read the reply, and so that the entry cannot be approved by changing its status alone. The research found no open route to the same data: Wikidata held two parkrun events for the United Kingdom, and OpenActive did not list parkrun as a publisher."

