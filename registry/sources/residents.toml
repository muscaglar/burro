]
notes = "The limit on use is a fairness rule, not a licence limit (ADR 0006, ADR 0014). The three tables are country of birth, ethnic group and religion. Until 24 September 2026 the entry held household composition and age by five-year bands too. On that day the founder decided that age and household composition may feed a vibe and a ranking, and the two tables moved to ons-census-2021-age-and-household-tables. The same decision changed nothing here: ethnic group and religion are shown on an area's page and never ranked on, and country of birth was not asked about and stands as it did. Nothing else of this entry was changed: its status, its use and its evidence are as they were. All three tables also stand in ons-census-2021-protected-characteristics, for the audit: the two entries are read by different steps, and neither may be used for the other's purpose. The three evidence pages are ones the audit entry already holds. The attribution is the line that entry records from the Nomis copyright page. verified_how is secondary_source so that the entry cannot be approved by changing its status alone. That each table is published for output areas is as the design records it, and has not been checked in a file."
