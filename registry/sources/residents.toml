    "These two tables say who lived in an area: how old its residents were, and what its households were made of. They may feed a vibe and a ranking, and be shown. The founder decided it on 24 September 2026, for age and for household composition and for nothing else about residents (ADR 0006 as amended that day).",
    "A figure made from this entry says in its name who is counted, residents or households, and says beside it on the page that it is from Census 2021, taken on 21 March 2021.",
    "A person may ask for more of what a figure counts, and never for fewer. No measure from this entry may be read low in a recipe, stand in a scale with two ends, or feed a filter that includes or excludes an area.",
