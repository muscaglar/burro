# Licence registry: residents. Rules are in registry/README.md.
# Census tables about the people who lived in an area. They are shown as the statistics
# office's own table on an area's page. See ADR 0014. Two of them, age and household
# composition, may also feed a vibe and a ranking: the founder decided it on
# 24 September 2026, for those two and no other. See ADR 0006 as amended that day.
# Approved first, then gated, held and banned.
