notes = "Why the uses changed: the founder's decision of 24 September 2026. Asked whether the age and household make-up of residents may feed vibes and ranking, the founder answered yes, from the census. Until then both tables stood in ons-census-2021-resident-tables, for the census table alone. They were moved here so that the gate allows scoring for these two tables and for no other table about residents. The limit on every other table is a fairness rule, not a licence limit. How the licence was verified: every page under evidence_urls was opened on 2026-09-24, through a reader that extracts the text of a page. Each was asked twice, in different words, and what is recorded is what both gave. The Nomis copyright page says ONS material may be re-used under the terms of the Open Government Licence, 'whether commercially or privately', and asks for the source line in the attribution field. It states no version. The statistics office's page for TS003, the page of its topic summaries and its quality page each carry: 'All content is available under the Open Government Licence v3.0, except where otherwise stated'. The Nomis pages of the two tables show only '© Crown Copyright'. No page for TS007A was found on the statistics office's own website: four addresses shaped like that of TS003 gave no page. TS007A counts usual residents, in a total and 18 bands of five years, from 'Aged 4 years and under' to 'Aged 85 years and over'. TS003 counts households, in a total and 21 categories. The bulk page lists one zip for TS007A and two for TS003, and says a zip holds the geographies of the first release: output areas, super output areas, local authorities, regions and countries. It shows no size. The zip of extra areas of TS003 is not taken. The statistics office's page for version 4 of TS003 says its figures can be filtered by statistical area, and gives MSOA and LSOA as examples. No file of either table has been fetched or opened. The quality page is 'Quality and methodology information (QMI) for Census 2021', last revised on 23 November 2023. Under 'Conducting a census during the coronavirus pandemic' it says: 'the coronavirus pandemic may have affected some people's choice of usual residence on Census Day, for example, students and in some urban areas', and 'The census counts students at their term-time address'. It reports an analysis by the Greater London Authority that found 'many young adults leaving London during lockdown' and 'many young adults returning to London during the spring and summer of 2021'. The census table on an area's page shows both tables too, so the entry keeps census_table. It lists display nowhere: a figure in a release is asked about as scoring. Until 25 September 2026 this entry listed under before_launch that the proxy audit had not run. The founder dropped the proxy audit on 25 September 2026 (ADR 0006 as amended that day), so it is listed no longer. The row that was written for the four measures and the two vibes that hold one stays in docs/design/residents-age-and-households.md, section 12, as a record of what was measured, and holds nothing back. Every condition of this entry stands as it was."

