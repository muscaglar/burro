attribution_verified = false
conditions = [
    "Read the crime files alone: the members of the zip whose names end `-street.csv`. No other member is ever opened. The zip that was saved on 2026-09-24 holds outcomes and stop and search beside the crime files, because all three boxes of the form were ticked. The founder decided on 2026-09-24 that it is kept as it was saved, that the crime files alone are read, and that the rest of the zip is never opened. Never read the stop and search files: the site says they hold the ethnicity, gender and age of the person stopped. The founder decided the same day that they are never read, whatever the rule on residents comes to say, because they record whom the police stopped and not who lives in a place. Never read the outcomes files either. A later file is saved with the crime box alone ticked.",
    "Locations are anonymised snap points, not where a crime happened. Say so wherever crime figures appear.",
    "PLAN section 9: recorded crime is off by default, shown as rates by category with caveats, never labelled safe or unsafe, and never rolled into one safety score.",
    "OGL does not cover personal data. Do not try to link records to individuals or addresses.",
    "Ingest the bulk CSV archives, not live API calls, so each data release is reproducible.",
]
status = "approved"
uses = ["scoring", "display"]
cadence = "Monthly. Latest month available on 2026-09-23 was July 2026. The custom download form covers August 2023 to July 2026."
verified_how = "primary_source"
verified_on = 2026-09-23
evidence_urls = [
    "https://data.police.uk/about/",
    "https://data.police.uk/data/",
    "https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/",
]
file_urls = [
    "https://policeuk-data.s3.amazonaws.com/download/8af8d28d28ffb22827ea2b9ee45fb67e9dd724fd.zip",
]
notes = "The address under file_urls is the one a browser saved the file of 2026-09-24 from, as the browser recorded it on the file. It names that one file and no other: the form makes a file for each request, under a name of its own. The browser recorded that it was sent there from https://data.police.uk/. It is on policeuk-data.s3.amazonaws.com, which is not the host of the publisher's pages. No page of the publisher that was read names that host: the form at https://data.police.uk/data/ and the archive page were opened on 2026-09-24 through a reader that extracts, and neither shows where a file is served from. So nothing but the browser's record stands behind the address, and a person should see it in a browser. It is there to name the address a file saved by hand came from, and is no evidence of the licence. One reading of the form that day gave all three boxes as ticked when the page opens, as one reading of 2026-09-23 had. How it was verified: OGL v3.0 is stated on data.police.uk/about. The drafter and the reviewer each fetched the page on 2026-09-23, and the research confirmed it independently. It is the v1 recorded-crime source in PLAN section 7. The About page says 'The data on this site is published by the Single Online Home National Digital Team'. I did not confirm which legal body that team belongs to. The page gives no attribution statement of its own, so the OGL v3.0 default statement applies (wording checked against the licence text today). Metropolitan Police Service, City of London Police and British Transport Police are all on the download form. The site says geocoding accuracy varies from 60% to 97% by force. Rates need a population denominator, which comes from ons-lsoa-population-estimates. The download form offers three tick boxes: crime, outcomes, and stop and search. Months before August 2023 are not on the form, and I did not check the archive page."

