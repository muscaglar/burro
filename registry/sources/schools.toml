[[source]]
id = "dfe-gias"
name = "Get Information About Schools (GIAS) establishment downloads"
publisher = "Department for Education"
url = "https://get-information-schools.service.gov.uk/Downloads"
dimension = "schools"
licence = "OGL-3.0"
licence_url = "https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/"
commercial_use = "yes"
share_alike = false
attribution = "Contains public sector information licensed under the Open Government Licence v3.0."
attribution_verified = true
conditions = [
    "Use the public bulk downloads only. The acceptable use policy forbids scraping or harvesting the website interface, 'including via AI bots, headless browsers or automated scripts'.",
    "Ingest establishment files only. Do not ingest the governors downloads, which are records about named people.",
    "OGL v3 does not cover personal data. Drop any personal fields in the establishment file (head teacher name fields are expected) at ingest, and confirm the column list on first download.",
    "The acceptable use policy says: 'Do not combine GIAS data with other sources to create or infer personal data beyond what is lawfully and openly available.'",
    "The service gives no dataset-specific attribution statement, so the OGL v3 default applies. Name the Department for Education as the source beside it.",
    "If the extract holds pupil intake fields (for example free school meals percentage or pupil counts by sex), drop them at ingest. They describe people, not places (PLAN section 9).",
    "Keep the religious character field out of ranking and tags until the founder decides. It describes the school, but religion is a protected characteristic.",
    "No catchment claims. Distance to a school is not admission.",
]
status = "approved"
uses = ["destination_search", "scoring", "display"]
cadence = "Daily."
verified_how = "primary_source"
verified_on = 2026-09-23
evidence_urls = [
    "https://get-information-schools.service.gov.uk/Downloads",
    "https://get-information-schools.service.gov.uk/TermsofUse",
    "https://get-information-schools.service.gov.uk/AcceptableUsePolicy",
    "https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/",
]
notes = "How it was verified: Re-checked by the reviewer on 2026-09-23. The Downloads page and Terms of use page state 'All content is available under the Open Government Licence v3.0, except where otherwise stated', and the acceptable use policy names the public downloads as the route for 'offline analysis or system ingestion'. The liveability research also marks it verified. In this domain GIAS supplies school and college names and coordinates so a named school resolves as a destination. The schools dimension uses the same dataset for features; 'scoring' and 'display' are listed for that and should be re-checked by that domain's review. If the schools domain drafts its own entry, merge into this id. Join key is URN. The 'except where otherwise stated' carve-out was not traced field by field; nothing on the three pages marks any establishment field as excluded. Universities are not in GIAS. Join key to Ofsted and performance tables is URN. The acceptable use policy was read today at the URL above, so the scraping ban no longer rests on the research report alone. It also says: 'Where GIAS data is made available under the OGL, you must attribute appropriately and comply with the licence terms of use stated on the service.' No publisher-specific attribution wording was found on the Downloads, terms or policy pages, so the OGL v3.0 default applies. I did not open the extract, so the pupil intake column names are from memory, not checked."

