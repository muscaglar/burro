id = "dfe-gias"
name = "Get Information About Schools (GIAS) establishment downloads"
publisher = "Department for Education"
url = "https://get-information-schools.service.gov.uk/Downloads"
dimension = "schools"
licence = "OGL-3.0"
licence_url = "https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/"
commercial_use = "yes"
share_alike = false
attribution = "Contains public sector information licensed under the Open Government Licence v3.0."
attribution_verified = true
conditions = [
    "Use the public bulk downloads only. The acceptable use policy forbids scraping or harvesting the website interface, 'including via AI bots, headless browsers or automated scripts'.",
    "Ingest establishment files only. Do not ingest the governors downloads, which are records about named people.",
    "OGL v3 does not cover personal data. Drop any personal fields in the establishment file (head teacher name fields are expected) at ingest, and confirm the column list on first download.",
    "The acceptable use policy says: 'Do not combine GIAS data with other sources to create or infer personal data beyond what is lawfully and openly available.'",
    "The service gives no dataset-specific attribution statement, so the OGL v3 default applies. Name the Department for Education as the source beside it.",
    "If the extract holds pupil intake fields (for example free school meals percentage or pupil counts by sex), drop them at ingest. They describe people, not places (PLAN section 9).",
    "Never read the religious character of a school: not its character, its ethos or its diocese. The founder decided on 2026-09-24 that it does not count as an amenity, so a school is counted without regard to faith. It describes the school, but religion is a protected characteristic.",
    "No catchment claims. Distance to a school is not admission.",
]
status = "approved"
uses = ["destination_search", "scoring", "display"]
cadence = "Daily."
verified_how = "primary_source"
verified_on = 2026-09-23
evidence_urls = [
    "https://get-information-schools.service.gov.uk/Downloads",
    "https://get-information-schools.service.gov.uk/TermsofUse",
    "https://get-information-schools.service.gov.uk/AcceptableUsePolicy",
    "https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/",
]
file_urls = [
    "https://ea-edubase-api-prod.azurewebsites.net/edubase/downloads/File.xhtml",
]
notes = "The address under file_urls is the one a browser saved the establishment download from on 2026-09-24, as the browser recorded it on the file, with its one parameter left out. The browser recorded that it was sent there from https://get-information-schools.service.gov.uk/. It is on ea-edubase-api-prod.azurewebsites.net, which is not the host of the publisher's pages. No page of the publisher was read for it: the acceptable use policy forbids reading the site with a program. So nothing but the browser's record stands behind the address, and a person should see it in a browser. The same address may answer for any download the form makes, the governors download among them, so the address does not say that a file is the establishment file: the name of the file inside the zip does. It is there to name the address a file saved by hand came from, and is no evidence of the licence. The list of columns was read in the file of 2026-09-24, as the conditions ask on first download: docs/research/data/by-hand-files.md names the columns that name a person or count pupils. One module reads the file, packages/pipeline/src/burro_pipeline/derive/schools_file.py: it hands over seven columns, which are the number of a school, its status, its type, its phase, its region and the two parts of its point, and refuses a request for any other. The condition on religious character was 'Keep the religious character field out of ranking and tags until the founder decides' until 2026-09-24. The decision was read in the record of that day's decisions, and was not heard from the founder. How it was verified: Re-checked by the reviewer on 2026-09-23. The Downloads page and Terms of use page state 'All content is available under the Open Government Licence v3.0, except where otherwise stated', and the acceptable use policy names the public downloads as the route for 'offline analysis or system ingestion'. The liveability research also marks it verified. In this domain GIAS supplies school and college names and coordinates so a named school resolves as a destination. The schools dimension uses the same dataset for features; 'scoring' and 'display' are listed for that and should be re-checked by that domain's review. If the schools domain drafts its own entry, merge into this id. Join key is URN. The 'except where otherwise stated' carve-out was not traced field by field; nothing on the three pages marks any establishment field as excluded. Universities are not in GIAS. Join key to Ofsted and performance tables is URN. The acceptable use policy was read today at the URL above, so the scraping ban no longer rests on the research report alone. It also says: 'Where GIAS data is made available under the OGL, you must attribute appropriately and comply with the licence terms of use stated on the service.' No publisher-specific attribution wording was found on the Downloads, terms or policy pages, so the OGL v3.0 default applies."

[[source]]
id = "ofsted-state-funded-schools-mi"
name = "Ofsted state-funded school inspections and outcomes: monthly management information"
publisher = "Ofsted"
url = "https://www.gov.uk/government/statistical-data-sets/monthly-management-information-ofsteds-school-inspections-outcomes"
dimension = "schools"
licence = "OGL-3.0"
licence_url = "https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/"
commercial_use = "yes"
share_alike = false
attribution = "Contains public sector information licensed under the Open Government Licence v3.0."
attribution_verified = false
conditions = [
    "The file mixes three inspection regimes that Ofsted says are not directly comparable. Never build a composite Ofsted grade. Show the published outcome and inspection date as they are.",
    "This is management information, not official statistics, and can be revised.",
    "At first ingest, save a dated copy of the dataset page footer to registry/evidence. Nobody has read that page as far as its footer.",
    "Never read the religious character of a school: not its character, its ethos or its denomination, under whatever name the file holds it. The founder decided on 2026-09-24 that it does not count as an amenity, so a school is counted and shown without regard to faith. The publisher says it takes a school's 'religious character, religious ethos' from the register of schools, so take it that the file holds both. Read named columns only.",
    "Never read a column that describes a school's pupils, such as how deprived they are. It describes people and not a place (decision record 0006).",
]
status = "approved"
uses = ["scoring", "display"]
cadence = "Monthly. Latest files are as at 31 August 2026, page updated 10 September 2026. The file as at 30 September 2026 had not been published by 24 September 2026."
verified_how = "primary_source"
verified_on = 2026-09-23
evidence_urls = [
    "https://www.gov.uk/government/statistics/state-funded-schools-inspections-and-outcomes-as-at-31-march-2026/methodology-state-funded-schools-inspections-and-outcomes-as-at-31-march-2026",
    "https://www.gov.uk/government/statistics/state-funded-schools-inspections-and-outcomes-as-at-31-march-2026",
    "https://www.gov.uk/government/collections/maintained-schools-and-academies-inspections-and-outcomes-official-statistics",
    "https://www.gov.uk/government/statistical-data-sets/monthly-management-information-ofsteds-school-inspections-outcomes",
    "https://assets.publishing.service.gov.uk/media/6aa0175392e72b8ac437ef37/Management_information_-_state-funded_schools_-_latest_inspections_as_at_31_August_2026.csv",
]
file_urls = [
    "https://assets.publishing.service.gov.uk/media/6aa0175392e72b8ac437ef37/Management_information_-_state-funded_schools_-_latest_inspections_as_at_31_August_2026.csv",
]
notes = "How it was verified: Ofsted's methodology page for these statistics states 'This publication is licensed under the terms of the Open Government Licence v3.0 except where otherwise stated' (reviewer fetch, 2026-09-23), which matches the research. The OGL v3.0 footer was also read on Ofsted's GOV.UK collection page and on the March 2026 release page. It is a v1 source in PLAN section 7. The licence statement is on the methodology page for the official statistics, which describe the monthly management information as part of the same output. The footer on the management information page itself has still not been seen, so the attribution stays unverified: I cannot rule out a statement on that page or inside the file. The methodology page says report card outcomes 'are distinct from the judgements under the original EIF and so are not directly comparable'. Report cards began on 10 November 2025 and have no overall grade. The last address under evidence_urls, on assets.publishing.service.gov.uk, is the file of latest inspections as at 31 August 2026 itself, as the publisher's page listed it on 2026-09-23. It was read through a reader that extracts, which was asked twice, in different words, and gave the same address both times. GOV.UK hands out files from that host, which has no pages of its own, so an entry can name it only by a file. It is there to name the host the file is on. Fetch holds a file to the addresses under file_urls. It is no evidence of the licence. No file was fetched to read the address. A file that is reissued is given a new address. The dataset page was read again on 2026-09-24, three times in different words, through a reader that extracts. The newest file of latest inspections is still the one as at 31 August 2026, at the address under file_urls, which one reading gave letter for letter, with its size as 16.3 MB. The page says it was last updated on 10 September 2026, and its newest change reads 'Published management information as at 31 August 2026'. The change of 14 July 2026 reads 'updated the release schedule with publication dates up until January 2027': the schedule itself was not read. No reading returned the footer of the page, so the condition on the footer stands. The methodology page was read once that day and gave the licence sentence as recorded above. It says 'We get data indicating whether schools are open or have closed, their type, phase of education, religious character, religious ethos and any links to predecessor schools' from the register of schools, which is why the conditions take it that the file holds a school's religious character. Nobody has read the names of the columns of the file. The condition on religious character was added on 2026-09-24, as decision record 0006 has it since it was amended that day: 'It is no amenity. Schools are counted without regard to faith, and the column is never read.'"

