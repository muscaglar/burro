dimension = "schools"
licence = "OGL-3.0"
licence_url = "https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/"
commercial_use = "yes"
share_alike = false
attribution = "Contains public sector information licensed under the Open Government Licence v3.0."
attribution_verified = false
conditions = [
    "The file mixes three inspection regimes that Ofsted says are not directly comparable. Never build a composite Ofsted grade. Show the published outcome and inspection date as they are.",
    "This is management information, not official statistics, and can be revised.",
    "At first ingest, save a dated copy of the dataset page footer to registry/evidence. Nobody has read that page as far as its footer.",
]
status = "approved"
uses = ["scoring", "display"]
cadence = "Monthly. Latest files are as at 31 August 2026, page updated 10 September 2026."
verified_how = "primary_source"
verified_on = 2026-09-23
evidence_urls = [
    "https://www.gov.uk/government/statistics/state-funded-schools-inspections-and-outcomes-as-at-31-march-2026/methodology-state-funded-schools-inspections-and-outcomes-as-at-31-march-2026",
    "https://www.gov.uk/government/statistics/state-funded-schools-inspections-and-outcomes-as-at-31-march-2026",
    "https://www.gov.uk/government/collections/maintained-schools-and-academies-inspections-and-outcomes-official-statistics",
    "https://www.gov.uk/government/statistical-data-sets/monthly-management-information-ofsteds-school-inspections-outcomes",
]
notes = "How it was verified: Ofsted's methodology page for these statistics states 'This publication is licensed under the terms of the Open Government Licence v3.0 except where otherwise stated' (reviewer fetch, 2026-09-23), which matches the research. The OGL v3.0 footer was also read on Ofsted's GOV.UK collection page and on the March 2026 release page. It is a v1 source in PLAN section 7. The licence statement is on the methodology page for the official statistics, which describe the monthly management information as part of the same output. The footer on the management information page itself has still not been seen, so the attribution stays unverified: I cannot rule out a statement on that page or inside the file. The methodology page says report card outcomes 'are distinct from the judgements under the original EIF and so are not directly comparable'. Report cards began on 10 November 2025 and have no overall grade."

