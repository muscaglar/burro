# Licence registry: text. Rules are in registry/README.md.
# Approved first, then gated, held and banned.
schema_version = 1

[[source]]
id = "wikimedia-wikipedia-excerpts"
name = "English Wikipedia article excerpts"
publisher = "Wikimedia Foundation and Wikipedia contributors"
url = "https://en.wikipedia.org/wiki/Wikipedia:Reusing_Wikipedia_content"
dimension = "text"
licence = "CC-BY-SA-4.0"
licence_url = "https://foundation.wikimedia.org/wiki/Policy:Terms_of_Use"
commercial_use = "yes_with_conditions"
share_alike = true
attribution = "This article uses material from the Wikipedia article \"[article title]\" ([link to the article]), which is released under the Creative Commons Attribution-Share-Alike License 4.0 (https://creativecommons.org/licenses/by-sa/4.0/). The excerpt has been shortened."
attribution_verified = false
conditions = [
    "Show the excerpt verbatim in a marked box with a hyperlink to the article and a licence notice with a link to the licence text.",
    "Say when the text has been shortened or changed.",
    "Never pass Wikipedia prose to any prompt that writes Burro's own text. An LLM summary is plausibly adapted material and would have to be shared under CC BY-SA.",
    "Store in a separate table with licence metadata. Never an input to scoring, tags, gazetteer, cells or destination search.",
    "Images and other media in articles have their own licences and are not covered.",
    "Record the article revision ID for each excerpt.",
    "Text imported into Wikipedia from elsewhere can carry extra attribution duties. Skip any article whose page or footer shows one.",
]
status = "approved"
uses = ["display", "profile_text"]
cadence = "Continuous. Refresh per data release."
verified_how = "primary_source"
verified_on = 2026-09-23
evidence_urls = [
    "https://foundation.wikimedia.org/wiki/Policy:Terms_of_Use",
    "https://en.wikipedia.org/wiki/Wikipedia:Reusing_Wikipedia_content",
]
notes = "How it was verified: CC BY-SA 4.0 and the attribution options are confirmed from the Wikimedia Terms of Use and Wikipedia's reuse page, by the research, the drafter and this review on 2026-09-23. Verbatim attributed display is simple compliance, and share-alike is limited to display and profile text. Wikimedia prescribes the elements (link to the page, licence notice, note of changes), not a fixed string. The attribution now follows the example notice on Wikipedia's reuse page, with Burro's placeholders and a shortened-text sentence added, so it stays unverified. Most text is also available under GFDL. Terms of Use last updated 7 June 2023. Open decision 6 in the plan recommends the excerpt; profiles arrive in phase 3."

