id = "network-rail-nwr-schedule"
name = "NWR Schedule (Network Rail CIF train schedule, Rail Data Marketplace)"
publisher = "Network Rail Infrastructure Limited"
url = "https://raildata.org.uk/dataProduct/P-dbd92416-2f09-4f72-ad42-d53bbfec50f3/overview"
dimension = "transport"
licence = "Network-Rail-OGL-based"
licence_url = "https://raildata.org.uk/dataProduct/P-dbd92416-2f09-4f72-ad42-d53bbfec50f3/termsAndConditions"
commercial_use = "yes_with_conditions"
share_alike = false
attribution = "Contains public sector information licensed under the Open Government Licence v3.0."
attribution_verified = false
conditions = [
    "Gate check 1: register on Rail Data Marketplace, subscribe to NWR Schedule, and save the executed agreement (8 pages including Schedules 1 and 2) together with the RDM terms of use and the Platform Agreement for Data Consumers. The Platform Agreement has not been read by anyone on the project.",
    "Gate check 2: Schedule 1 section 7 (Territorial use restrictions) permits exercise of the licensed rights in 'UK', while the licence body grants a 'worldwide' licence. Burro serves people relocating from abroad and plans to sell the iOS app outside the UK. Get written confirmation from Network Rail that a UK-operated service readable from abroad is within the licence.",
    "Gate check 3: in the executed agreement, confirm whether Schedule 1 section 8 (Attribution) names an organisation. It is blank in the public copy, in which case the licence says to use the default statement. If an organisation is named, change the attribution. Set attribution_verified to true only after this check.",
    "Term is 1 year, renewing automatically, with 1 month notice. Schedule 2 says 'Access to the data will cease upon suspension, termination, or expiry of the Agreement.' Retention: 'May retain any data which has been received'.",
    "Do not use Network Rail, National Rail or train company brands or logos, and do not call the product 'official' (Network Rail open data feeds page).",
    "Do not use the data in a way that suggests official status or endorsement by the publisher.",
    "No rail-derived time may be shown to a user until all three gate checks pass (PLAN section 13).",
    "Convert with UK2GTFS nr2gtfs or a custom CIF converter. gb-transit cif2gtfs is documented only for the RDG feed.",
    "Rebuild matrices after the May and December timetable changes.",
]
status = "gated"
status_reason = "The 'Open (OGL3)' label and the full public licence were read on the product page on 2026-09-23 and allow commercial use. PLAN section 7 gates this source until the accepted terms are read and saved. Schedule 1 also carries a 'UK' territorial restriction that conflicts with the 'worldwide' grant and needs a written answer, and the attribution section is blank until the agreement is executed."
uses = ["routing", "scoring", "display"]
cadence = "Daily, updated overnight. Burro rebuilds quarterly and after the May and December timetable changes."
verified_how = "primary_source"
verified_on = 2026-09-23
evidence_urls = [
    "https://raildata.org.uk/dataProduct/P-dbd92416-2f09-4f72-ad42-d53bbfec50f3/overview",
    "https://raildata.org.uk/dataProduct/P-dbd92416-2f09-4f72-ad42-d53bbfec50f3/termsAndConditions",
    "https://raildata.org.uk/helpAndInformation/policies/terms-of-use",
    "https://www.networkrail.co.uk/who-we-are/transparency-and-ethics/transparency/open-data-feeds/",
    "https://www.networkrail.co.uk/who-we-are/transparency-and-ethics/transparency/",
]
notes = "The licence tab and all 8 pages of the embedded licence were re-read as page text on 2026-09-23 (public page, no sign-in). Every quotation in the draft matches. Public terms: permitted recipients 'All registered users'; permitted purposes 'The raw data may be made freely available or otherwise distributed to third parties'; charging model Free; no fair usage limit; special conditions blank. The licence is the OGL v3.0 text with 'Data Publisher' substituted; it lets users 'exploit the Information commercially and non-commercially' and gives the default attribution statement used here. The public copy is a template (start date shows 'null', Data Consumer is blank), so blank fields may be filled in when the agreement is executed; this is why attribution_verified is false. Network Rail's own licence page now leads to its Transparency page, which carries the 'Data Feeds Licence' text; it gives no attribution wording and applies to the legacy feeds platform, not the RDM product. The RDM terms of use (last updated 17 May 2024) are website terms and add no data restrictions. Includes London Overground and Elizabeth line. On 2026-09-24 no page of raildata.org.uk was read, so everything above stands as it was read on 2026-09-23. Read on 2026-09-24, through a reader that extracts, twice in different words: Network Rail's page on its open data feeds, its Data Feeds Licence, and the Rail Delivery Group's page on the marketplace. Network Rail's page says an account is needed for its own feeds site, that access 'is provided on a first come, first served basis and is currently restricted to 1,000 users', and that 'we do not allow any application or website using our data feeds to be called \"official\"'. It does not say which feeds that site gives. Its licence page says the feeds may be used 'provided that it's in compliance with the terms of the Open Government Licence', gives no attribution wording and names no version. The Rail Delivery Group's page says it 'provides and manages the RDM service', sends a person to www.raildata.org.uk to register, names no charge, and names four standard contracts: two platform agreements, a data sharing agreement and 'Open Government Licence (OGL3) - Rail Data Marketplace'. It gives the platform agreement for data consumers as https://raildata.org.uk/helpAndInformation/policies/platform-agreement-data-consumers, which is the one gate check 1 says nobody has read. How long a subscription takes to be granted is on no page that was read."

