attribution_beside_figures = true
conditions = [
    "Register on the TfL API portal before the first download and keep the registration details accurate. The licence 'shall apply from the date of registration'. The two files the open data page links are examples: 'The example feeds below are not updated and for demonstration purposes only'. Never take either.",
    "Open question for TfL: the open data page lists this feed with 'How often we publish a fresh copy of the feed: Weekly', 'Maximum time allowed between capturing and displaying the feed: 1 day' and 'Maximum time information can be displayed before being updated: 2 weeks'. The newest files TfL holds are of 3 October 2025, and Burro would show a figure worked out from one for months. The Transport Data Service terms hold no clause on storing the data or on how long a figure may be shown. See before_launch.",
    "Show beside every figure the day its file is of, which is in the name of the file. TfL's guide to the data says 'London Buses suggests that if this data is presented to end users then the date of the data is also provided', and that 'The London Buses network changes frequently'.",
    "Count no virtual bus stop as a stop, and show none. The guide says 'there is NO physical bus stop at these' and 'it is necessary to remove these bus stops in all customer facing applications'.",
    "The files say where each route stops, and nothing of how often a bus runs or at what hours. No figure made from them says how good a service is.",
    "Show all three attribution statements on the generated attributions page and credit TfL wherever a figure made from this data appears.",
    "Follow TfL design and branding guidelines, as the entry of the timetables states them. The open data page says of this feed 'Use the buses roundel for bus stops': Burro draws no stop of its own and uses no roundel.",
    "Do not use the data in a way that suggests official status or TfL endorsement.",
    "Limit requests to 500 calls per minute per data feed. TfL may throttle or limit access.",
    "Re-read the terms at every data release: TfL 'may at any time revise this Licence without notice'. If a condition is broken the licence ends automatically.",
]
status = "approved"
before_launch = [
    "A written answer from TfL, or a decision record, on showing figures worked out from a copy of this feed that is older than the two weeks the open data page gives for it.",
    "A person opens the terms and the open data page in a browser, confirms the three statements of credit and the three timings, and saves a dated copy of each in registry/evidence. Each was read on 2026-09-24 through a reader that extracts, which is not the page.",
]
uses = ["scoring", "display"]
cadence = "Weekly, the open data page says. TfL's forum says otherwise: no file has been put out on a schedule since September 2024, and the newest files are of 3 October 2025, put out by hand."
verified_how = "primary_source"
verified_on = 2026-09-24
evidence_urls = [
    "https://tfl.gov.uk/corporate/terms-and-conditions/transport-data-service",
    "https://tfl.gov.uk/info-for/open-data-users/our-open-data",
    "https://content.tfl.gov.uk/syndication-developer-guidelines-bus-stop-locations-routes.pdf",
    "https://tfl.gov.uk/info-for/open-data-users/design-and-branding",
]
file_urls = [
    "https://bus.data.tfl.gov.uk/stops-sequences/Data_3rdParties_bus-sequences-20251003.csv",
    "https://bus.data.tfl.gov.uk/stops-sequences/Data_3rdParties_bus-stops-20251003.csv",
]
notes = "Registered on 2026-09-24, for a count of the bus routes that stop near a home. The founder approved the dataset and registered on TfL's portal that day, as it was passed to whoever wrote this entry: neither was heard from the founder, and the day of registration was read in no record. How the licence was verified, on 2026-09-24, through a reader that extracts the text of a page: the open data page was read five times and the terms twice, in different words. The open data page lists 'Bus stop locations and routes' under its heading for buses, and says 'Using our data is subject to our terms and conditions', linked to the Transport Data Service terms. The terms say they 'apply to TfL's free transport data service and are based on version 2.0 of the Open Government Licence with specific amendments for Transport for London', and that a person is free to 'Exploit the Information commercially and non-commercially'. They give the three statements under attribution, which are as the other entries of this publisher hold them. The wording is not marked as verified: it was read through a reader, which is not the page. The branding page was not read that day, and stands as the entry of the timetables records it. What the page says of the feed: 'This dataset describes the London Buses standard network information. The network information includes the location of all bus stops in London and the sequence of bus stops that every bus route in London stops at. As our stops and routes do change on a frequent basis, you will need to come back to us regularly for the updates.' It gives the format as CSV and the content provider as 'iBus, TfL Surface Transport', and links a guide and two example files and no file that is kept up to date: 'You need to register to gain access to the live feeds'. The guide is the third address under evidence_urls, 'London Buses Standard Network Data for 3rd Parties', version 04 of 11 October 2011. It was read whole, as its seven pages, and is fifteen years old: it names the columns of each file as they then were, and says 'The date is presented in the file name', as its year, its month and its day. Where the addresses under file_urls were read: on TfL's own forum, in the topic https://techforum.tfl.gov.uk/t/bus-sequences-csv/6040 , in a post of 3 October 2025 by a member of staff whom the forum gives the title Digital Service Performance Manager. The post was read as the forum's own record of it, which gives both addresses written whole and with https, under the words 'latest version of the file is now here'. The store the files are in lists itself, at https://s3-eu-west-1.amazonaws.com/bus.data.tfl.gov.uk/?list-type=2&prefix=stops-sequences/&delimiter=/ : read on 2026-09-24, it held those two files and no other beside a folder named Archived, the file of sequences at 5,188,509 bytes and the file of stops at 1,384,590 bytes, each last changed on 3 October 2025. So no newer file was there on 2026-09-24. The files are on bus.data.tfl.gov.uk, which is no host of TfL's pages, so the entry names it under file_urls alone: no address on it is evidence of the licence. No fetch has tried either address, and whether either asks for a key is not known. Why the files are a year old, as the forum has it: in a topic its staff opened on 2 September 2024 and last changed on 26 January 2026, https://techforum.tfl.gov.uk/t/updated-26-jan-2026-issues-with-data-feeds/3609 , 'Bus stop locations (bus-stops.csv) and bus routes (bus-sequences.csv)' are listed among the feeds that 'are not updating'. People who use the files wrote in 2025 that files came each day until then, and that the files of each day were since put in the folder Archived. A newer source may stand in its place: on 15 October 2025 TfL's staff announced 'iBus1 Static Data, which provides data about bus stops, routes, schedules and vehicles', which they say is 'Usually updated every two weeks', at https://ibus.data.tfl.gov.uk/ . Its terms were not read, no entry covers it, and no file of it is named here. The entry tfl-journey-planner-timetables holds the timetables of buses too, which its page says are updated every 7 days. The names of the columns of the files of 2025 are not known: nobody has opened one."

