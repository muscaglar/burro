[[source]]
id = "osm-geofabrik-greater-london"
name = "OpenStreetMap Greater London extract (Geofabrik), routing street network"
publisher = "OpenStreetMap contributors (extract published by Geofabrik GmbH)"
url = "https://download.geofabrik.de/europe/united-kingdom/england/greater-london.html"
dimension = "transport"
licence = "ODbL-1.0"
licence_url = "https://opendatacommons.org/licenses/odbl/1-0/"
commercial_use = "yes_with_conditions"
share_alike = true
attribution = "© OpenStreetMap contributors"
attribution_verified = true
conditions = [
    "Routing street network only. Never use for gazetteer, cells, destination search or scoring. Walk-distance features use OS Open Roads.",
    "Build the street network from OSM alone and load GTFS as separate non-OSM inputs. The OSMF Trivial Transformations guideline lists 'In a format required for routing' as trivial only where the program runs 'Without reading any other observation data (important!)'.",
    "Publish a methods page naming the OSM extract date, routing engine version and settings. This is what ODbL 4.6(b) would accept in place of the database if share-alike were ever claimed.",
    "Credit OpenStreetMap beside commute times on web and iOS, not only on the map. Make 'OpenStreetMap' a link to https://www.openstreetmap.org/copyright so it is clear the data is under the Open Database License.",
    "Keeping matrices server-side is not a protection: ODbL 4.4(c) and 4.6 apply when a Produced Work from a Derivative Database is shown publicly.",
    "OSM comparison may set a global threshold but must never add, drop or correct an individual Overture or gazetteer record (OSMF Horizontal Layers guideline).",
    "Accepted residual risk from PLAN section 9: being asked to publish the travel-time table under ODbL.",
    "Record the extract timestamp in the release manifest. Cut with a few kilometres of buffer so edge cells route correctly.",
]
status = "approved"
uses = ["routing"]
cadence = "Geofabrik refreshes the extract about daily (123 MB .osm.pbf). Burro pins one extract per data release."
verified_how = "primary_source"
verified_on = 2026-09-23
evidence_urls = [
    "https://www.openstreetmap.org/copyright",
    "https://download.geofabrik.de/europe/united-kingdom/england/greater-london.html",
    "https://osmfoundation.org/wiki/Licence/Attribution_Guidelines",
    "https://osmfoundation.org/wiki/Licence/Community_Guidelines/Trivial_Transformations_-_Guideline",
    "https://osmfoundation.org/wiki/Licence/Community_Guidelines/Horizontal_Map_Layers_-_Guideline",
    "https://opendatacommons.org/licenses/odbl/1-0/",
]
file_urls = [
    "https://download.geofabrik.de/europe/united-kingdom/england/greater-london-latest.osm.pbf",
]
notes = "How it was verified: ODbL 1.0 confirmed on openstreetmap.org/copyright and on the Geofabrik download page on 2026-09-23. Commercial use is allowed with attribution. PLAN section 9 and ADR 0004 set the written OSM policy that the conditions repeat. All pages except the ODbL text itself were re-read as page text on 2026-09-23. The Geofabrik footer reads 'Data processed by Geofabrik GmbH and created by OpenStreetMap Contributors | License: ODbL 1.0'. The copyright page gives no fixed credit wording and points to the OSMF Attribution Guidelines (adopted 2021-06-25), which say 'Attribution must be to \"OpenStreetMap\"' and that 'The historical forms of attribution \"© OpenStreetMap contributors\" or \"© OpenStreetMap\" are acceptable'. They also say 'Routing engines that use OpenStreetMap data must credit OpenStreetMap' and 'Applications that incorporate such a routing engine must credit OpenStreetMap'. New detail: the Trivial Transformations guideline also lists 'Other applications of geometric and graph algorithms on OSM data (Voronoi diagrams, travelling distances etc.) if they are driven by OSM data only'. Walking and cycling matrices fit that wording. Public transport matrices combine OSM with GTFS, so they rest on the project's own reading, not on an OSMF ruling, and no professional has reviewed it. This entry covers routing only."

[[source]]
id = "tfl-journey-planner-timetables"
name = "TfL Journey Planner timetables (TransXChange)"
publisher = "Transport for London"
url = "https://tfl.gov.uk/info-for/open-data-users/our-open-data"
dimension = "transport"
licence = "TfL-Open-Data"
licence_url = "https://tfl.gov.uk/corporate/terms-and-conditions/transport-data-service"
commercial_use = "yes_with_conditions"
share_alike = false
attribution = "Powered by TfL Open Data\nContains OS data © Crown copyright and database rights 2016\nGeomni UK Map data © and database rights [2019]"
attribution_verified = true
conditions = [
    "Open question for TfL: the open data page lists this feed with 'How often we publish a fresh copy of the feed: 1440 minutes', 'Maximum time allowed between capturing and displaying the feed: 10 minutes' and 'Maximum time information can be displayed before being updated: 1440 minutes'. TfL's Syndication Developer Guidelines (version 2.0, 2012-05-21), linked at the top of that page, say 'When using a TfL feed (or data service) you agree to follow the appropriate Terms and Conditions and the implementation rules within this User Guide', and state the timeliness rules with 'must'. Those rules are written for TfL's XML feeds and send readers to the per-dataset page for other formats. The Transport Data Service terms themselves have no caching, storage or display-duration clause. Burro plans to show travel times built from a snapshot that is rebuilt quarterly. To clear the gate, save in registry/evidence either TfL's written confirmation that this is acceptable, or a decision record that rebuilds everything derived from this feed on a cadence that meets the published timings.",
    "Register on the TfL API portal before the first download and keep the registration details accurate. The licence 'shall apply from the date of registration'. The zip linked on the open data page is an example that 'is not updated'.",
    "Save dated copies of the terms, the open data page entry and the Syndication Developer Guidelines in registry/evidence, and re-read the terms at every data release. The terms page has no version or date and says TfL 'may at any time revise this Licence without notice'.",
    "Show all three attribution statements on the generated attributions page and credit TfL wherever TfL-derived commute times appear.",
    "Follow TfL design and branding guidelines: do not use or adapt TfL branding, the roundel, TfL maps or New Johnston font without a licence, do not use TfL trademarks in the app or product name, and do not use terms such as 'official' or 'in partnership'. The words 'London Underground', 'Tube', 'London Buses', 'DLR', 'London Overground', 'London River Services' and 'London Cable Car' may be used only to label services, for service messaging, journey planning and wayfinding, and in app store descriptions and marketing to describe services.",
    "Do not use the data in a way that suggests official status or TfL endorsement.",
    "Limit requests to 500 calls per minute per data feed. TfL may throttle or limit access.",
    "If a condition is broken the licence ends automatically, and the licence gives no right to use the data after it has ended.",
    "Covers Underground, bus, DLR, tram, cable car and river only. London Overground and Elizabeth line are not in this feed and must come from rail data.",
    "Label outputs as timetabled times: TfL states the timetables 'do not take account of planned engineering works'.",
]
status = "approved"
before_launch = [
    "A written answer from TfL, or a decision record, on showing travel times computed from a timetable snapshot that is rebuilt quarterly, given the timing values TfL publishes for this feed.",
]
uses = ["routing", "scoring", "display"]
cadence = "Weekly. TfL says 'The timetables are updated every 7 days.' TfL publishes a fresh copy every 1440 minutes. The zip its page links is an example of 24.31 MB, and the file fetched on 2026-09-24 is 143,161,603 bytes. Burro plans one snapshot per data release (quarterly, plus after major network changes), subject to the gate check."
verified_how = "primary_source"
verified_on = 2026-09-24
evidence_urls = [
    "https://tfl.gov.uk/corporate/terms-and-conditions/transport-data-service",
    "https://tfl.gov.uk/info-for/open-data-users/our-open-data",
    "https://content.tfl.gov.uk/syndication-developer-guidelines.pdf",
    "https://tfl.gov.uk/info-for/open-data-users/design-and-branding",
]
file_urls = [
    "https://tfl.gov.uk/journey-planner-timetables.zip",
    "https://tfl.gov.uk/tfl/syndication/feeds/journey-planner-timetables.zip",
]
notes = "Licence confirmed: the Transport Data Service terms were read on tfl.gov.uk on 2026-09-23 and allow commercial use with attribution. No other source of Underground timetables is approved. Read again on 2026-09-24, through a reader that extracts, twice in different words: the terms, the open data page, the branding page and the front page of the portal. The three attribution statements, the limit of 500 calls a minute and 'shall apply from the date of registration' are as recorded. The terms grant 'a worldwide, royalty-free, perpetual, non-exclusive Licence', are 'governed by the laws of England and Wales', and hold no clause on storing the data or on how long a figure may be shown. The open data page names six modes for this feed and no other: 'London Underground, bus, DLR, tram, cable car and river services'. It names no address for the file that is kept up to date. It sends the reader to the portal, which says 'By registering to use our open data, you confirm that you accept our Open Data terms and conditions'. The portal names no charge and no wait. Two addresses of the file were read on TfL's own forum, techforum.tfl.gov.uk, and on no page this entry holds: https://tfl.gov.uk/tfl/syndication/feeds/journey-planner-timetables.zip in two posts of 2025 by people who use the file, and tfl.gov.uk/journey-planner-timetables.zip in a post of 3 September 2026 by TfL's staff. Until 2026-09-24 neither was under file_urls. In a post of 6 May 2025 TfL's staff call the weekly issue 'the weekly TransXChange drop'. What changed on 2026-09-24: the founder registered on the portal that day, as it was passed to whoever wrote this, so the licence runs from that day. The day was read in no record. And both addresses were named under file_urls, from what TfL's forum holds. The post of 3 September 2026 was read as the forum's own record of it, at https://techforum.tfl.gov.uk/t/transxchange-resolving-issues-with-routes-6-and-185/6341 : the forum marks its writer as staff, and the post reads 'We just issued an additional TransXChange dataset fixing issues with routes 6 and 185', with the address written as tfl.gov.uk/journey-planner-timetables.zip and linked with http and not https. The first address under file_urls is that address with https before it, which is what fetch asks for. It is the address the list m5-journeys holds, and a fetch took the file from it on 2026-09-24. In the same topic, on 8 September 2026, a member of staff whom the forum gives the title Digital Service Performance Manager wrote that 'the new versions of the files have been uploaded into journey-planner-timetables.zip. It may take an hour or so to refresh'. The second address under file_urls rests on less: it was given in a topic of June 2021, https://techforum.tfl.gov.uk/t/https-tfl-gov-uk-cdn-static-cms-documents-journey-planner-timetables-zip/1833 , by a person who uses the file and whom the forum does not mark as staff, in answer to one who had found the example alone. It is named because a request for the first may be sent on, and fetch keeps a file only where the address it arrived from is one this entry names. It is on the host of the first and has the same name. The zip the open data page links, at /cdn/static/cms/documents/ on the same host, is named nowhere here: the page says it 'is not updated and is for demonstration purposes only', so a file that arrives from that address is refused, which is meant. The file asks for no key: fetch sends none, and was given the file on 2026-09-24. If it comes to ask for one, fetch cannot take it, because an address in a list holds no key: a person saves the file and hands it over with by-hand, and writes the address with no key in it: if a key stands after the question mark, the question mark and all that follows are left out. In a post of 2 August 2023 a member of staff whom the forum gives the title Product Manager, TfL Digital, wrote that the file is held in a cache for 24 hours that all users share, so the file a request is given may be a day older than the newest. For this change the terms were read twice more that day and the open data page five times, in different words, and both stand as recorded: 'This Licence shall apply from the date of registration', the three statements of credit, 'Limit traffic requests up to a maximum of 500 calls per minute per data feed', and for this feed 1440 minutes, 10 minutes and 1440 minutes. The terms say they are 'based on version 2.0 of the Open Government Licence with specific amendments for Transport for London'. What the file holds was read on 2026-09-24 with describe, by a program and by no person, and the list m5-journeys states it: 826 timetables in six zips inside one, of the modes bus, underground, rail, ferry and tram, which run between 2026-09-19 and 2026-12-23. By the names of its files it holds the six kinds of service the open data page names and no timetable of the London Overground or of the Elizabeth line. It holds 46 timetables of replacement buses too, which the page does not name."

[[source]]
id = "tfl-step-free-station-topology"
name = "TfL step-free access and station topology data"
publisher = "Transport for London"
url = "https://tfl.gov.uk/info-for/open-data-users/our-open-data"
dimension = "transport"
licence = "TfL-Open-Data"
licence_url = "https://tfl.gov.uk/corporate/terms-and-conditions/transport-data-service"
commercial_use = "yes_with_conditions"
share_alike = false
attribution = "Powered by TfL Open Data\nContains OS data © Crown copyright and database rights 2016\nGeomni UK Map data © and database rights [2019]"
attribution_verified = false
attribution_beside_figures = true
conditions = [
    "Files: https://api.tfl.gov.uk/stationdata/tfl-stationdata-gtfs.zip and https://api.tfl.gov.uk/stationdata/tfl-stationdata-detailed.zip.",
    "The data guide says: 'When using a TfL feed (or data service) you agree to follow the terms and conditions for TfL's free Transport Data Service, and the implementation rules within this user guide.' The guide sets no timing or display rules of its own. Save the guide (specification version 1.0, July 2021) with the licence evidence.",
    "Register on the TfL API portal first. The licence 'shall apply from the date of registration'. Re-read the terms at every data release, because TfL may revise them without notice.",
    "Show the TfL attribution statements on the attributions page and wherever a station fact from this data is shown.",
    "Only step-free pathways are listed. The guide says 'This is NOT an exhaustive list of all pathways through a station, only those that can be taken step-free have been considered.' A missing pathway means 'not recorded as step-free', not 'no route'. Do not present absence as a fact about a station.",
    "Thameslink data is partial: step and gap values are omitted where a manual ramp is needed, HasStepFreeRouteInformation is False for Thameslink platforms, and lifts, toilets, Blue Badge parking and taxi ranks 'may be present despite information about them not being included'. Treat a blank as unknown.",
    "Station facts describe buildings, which fits the PLAN fairness rule. Any feature built from this still needs to be on the feature allowlist.",
    "Follow TfL design and branding guidelines and do not imply official status or endorsement.",
]
status = "approved"
uses = ["scoring", "display"]
cadence = "TfL states no update frequency for the topology files. Burro snapshots one copy per data release. The live lift disruption feed is not covered by this entry."
verified_how = "primary_source"
verified_on = 2026-09-23
file_urls = [
    "https://api.tfl.gov.uk/stationdata/tfl-stationdata-detailed.zip",
]
evidence_urls = [
    "https://content.tfl.gov.uk/step-free-access-and-toilet-data-guide.pdf",
    "https://tfl.gov.uk/corporate/terms-and-conditions/transport-data-service",
    "https://tfl.gov.uk/info-for/open-data-users/our-open-data",
]
notes = "How it was verified: TfL's own data guide, read page by page on 2026-09-23, states the dataset is under the Transport Data Service terms, and those terms were read on tfl.gov.uk the same day and allow commercial use with attribution. The open data page lists no display timings for these files. I read all ten pages of the guide and every claim in the draft checks out. The guide lists London Underground, London Overground, DLR, TfL Rail (Elizabeth line), Thameslink and Tram, plus Emirates Air Line (now London Cable Car) and riverboat piers. Stations.csv carries a mandatory FareZones column, which answers the research file's open question about a fare zone source. The separate Station facilities and Station locations KML feeds are under the same terms but carry a published display time of 4320 minutes and are not part of this entry."

[[source]]
id = "tfl-unified-api-journey-planner"
name = "TfL Unified API: Journey Planner results"
publisher = "Transport for London"
url = "https://api.tfl.gov.uk/"
dimension = "transport"
licence = "TfL-Open-Data"
licence_url = "https://tfl.gov.uk/corporate/terms-and-conditions/transport-data-service"
commercial_use = "yes_with_conditions"
share_alike = false
attribution = "Powered by TfL Open Data\nContains OS data © Crown copyright and database rights 2016\nGeomni UK Map data © and database rights [2019]"
attribution_verified = true
conditions = [
    "Display and validation only. Journey Planner results are never an input to ranking or scoring (PLAN section 4 and the transit-routing report).",
    "Register on the TfL API portal first and keep the registration details accurate. The licence 'shall apply from the date of registration'.",
    "Rate limit: the licence says 'Limit traffic requests up to a maximum of 500 calls per minute per data feed' and lets TfL throttle further. Do not use the API to build the travel-time matrix.",
    "The app key stays on the API server and is never shipped to web or iOS clients.",
    "Show the TfL attribution statements next to any route detail taken from the API.",
    "Open question for TfL: the open data page asks users of the older XML 'Journey Planner API Beta' to 'Add the attribution \"Powered by the Transport for London Journey Planner API\" in the application credits'. It is not clear whether this also applies to Journey Planner results from the Unified API. Until TfL answers, the three licence statements are the confirmed minimum.",
    "Open question for TfL: Journey Planner responses can include National Rail legs. The licence does not 'Grant any rights to use any other intellectual property rights (whether owned by TfL or others)'. Until TfL answers, show such results only on demand, as returned, and do not store them.",
    "Follow TfL design and branding guidelines and do not imply official status or endorsement.",
    "If responses are cached, keep the cache short-lived. The terms are silent on caching.",
    "Re-read the terms at every data release. TfL 'may at any time revise this Licence without notice'. If a condition is broken the licence ends automatically.",
    "This entry covers Journey Planner results only. If StopPoint or Line responses are ever used for scoring, extend the uses list first.",
]
status = "approved"
uses = ["display", "validation_only"]
cadence = "Live API. Called on demand when a user opens a result, and for a validation sample of about 1,000 origin and destination pairs per data release."
verified_how = "primary_source"
verified_on = 2026-09-23
evidence_urls = [
    "https://tfl.gov.uk/corporate/terms-and-conditions/transport-data-service",
    "https://tfl.gov.uk/info-for/open-data-users/unified-api",
    "https://tfl.gov.uk/info-for/open-data-users/our-open-data",
    "https://tfl.gov.uk/info-for/open-data-users/design-and-branding",
    "https://api-portal.tfl.gov.uk/",
]
notes = "How it was verified: The TfL Transport Data Service terms were read directly on tfl.gov.uk on 2026-09-23 and allow commercial use with attribution. verify-routing-feasibility.md marks as confirmed that the Unified API is free, allows commercial use with attribution, and is limited to 500 requests per minute. Burro calls the API live and on demand, which is the use TfL describes for it, so the display-time question on the timetable feed does not arise here. Terms, open data page, Unified API page and branding page were read as page text on 2026-09-23. The attribution statements match the terms page exactly. TfL's Unified API page says the API 'is designed to allow you to query in realtime and on demand'. The figure of 50 requests per minute for anonymous use comes from the verification file; Burro always uses a key, so it does not matter in practice. The portal was read on 2026-09-24, through a reader that extracts. Its front page, read twice in different words, gives the steps: register, follow the link in the confirmation email, sign in, open Products and 'create a subscription for the 500 requests data plan', then read the keys under Profile. It says 'please append the `app_key` as a query parameter to your requests'. Whether the key may be sent in a header is not said there. A key in an address can be written down by whatever the request passes through, so no address that holds the key is ever logged or printed. The page of products, read once, gives 50 requests a minute for anonymous use. The page of questions, read once, says 'User accounts that haven't made a request in the last year will be automatically disabled and deleted'. No page names a charge or a wait. On TfL's forum a post of 17 September 2026 by TfL's staff says direct access to the older Journey Planner API is being retired, that three of its hosts may no longer answer from 26 October 2026, and that results stay available through the Unified API. So the attribution that the open data page asks of the older API may soon apply to nothing: read that page again before launch."

[[source]]
id = "tfl-ptal-2015"
name = "Public Transport Accessibility Levels (PTAL), 2015, on London Datastore"
publisher = "Transport for London (published on the Greater London Authority's London Datastore)"
url = "https://data.london.gov.uk/dataset/public-transport-accessibility-levels-24rz6"
dimension = "transport"
licence = "OGL-2.0"
licence_url = "https://www.nationalarchives.gov.uk/doc/open-government-licence/version/2/"
commercial_use = "yes_with_conditions"
share_alike = false
attribution = "Contains public sector information licensed under the Open Government Licence v2.0."
attribution_verified = false
conditions = [
    "This entry covers the files of 2015 on the London Datastore and no other. The page of the dataset shows the licence 'Open Government Licence v2'. Never take PTAL data from Transport for London's own pages or from WebCAT: TfL's open data page says 'The use of this data, either through WebCAT or when downloaded from here, is subject to the WebCAT terms of use', and those terms, as they were read, grant no right to copy, publish or reuse.",
    "TfL's open data page says of PTAL: 'Any data that was previously available is superseded by the data provided currently, and should no longer be used.' That is the owner's word on how good the older data is, and is no term of the licence the Datastore shows. So say beside every figure that it is of 2015, that it counts no service that began after it, of which the Elizabeth line is one, and that its publisher has since put out newer figures under terms that do not let Burro take them.",
    "A figure is shown, and is read to check what Burro works out for itself from timetables. No area is ranked on it until the founder has said that a figure of 2015 may be: see before_launch. The research behind the plan says to build Burro's own index from current timetables.",
    "Show a level as the publisher grades it, from 0 to 6b. Make no other grade from it, and do not call a level a journey time: the page says the measure does not consider 'The speed or utility of accessible services', crowding, or ease of interchange.",
    "London Datastore site terms apply to every dataset: a reuser 'Should, if you extract and re-use any data from this site, explicitly state that the Greater London Authority cannot warrant the quality or accuracy of the data' and 'Must not in any way imply' GLA endorsement.",
    "Name Transport for London as the source beside the statement of the licence. The page of the dataset states no credit of its own.",
    "Do not suggest that Transport for London or the Greater London Authority endorses Burro. Use no roundel and no map of TfL's.",
]
status = "approved"
before_launch = [
    "The founder decides whether an area may be ranked on a figure of 2015, which its publisher says is superseded and should no longer be used, or whether it is shown alone with its year.",
    "A person opens the page of the dataset in a browser, confirms the licence it shows, and saves a dated copy in registry/evidence. It was read on 2026-09-24 through a reader that extracts, which is not the page.",
]
uses = ["scoring", "display", "validation_only"]
cadence = "Static. The Datastore says the dataset was last updated over nine years ago, and holds the files of 2015 alone."
verified_how = "primary_source"
verified_on = 2026-09-24
evidence_urls = [
    "https://data.london.gov.uk/dataset/public-transport-accessibility-levels-24rz6",
    "https://data.london.gov.uk/about/terms-and-conditions/",
    "https://tfl.gov.uk/info-for/open-data-users/our-open-data",
    "https://tfl.gov.uk/corporate/terms-and-conditions/webcat",
    "https://www.nationalarchives.gov.uk/doc/open-government-licence/version/2/",
]
file_urls = [
    "https://data.london.gov.uk/download/24rz6/514d2847-94a8-4b9d-8a70-fdded01719a0/2015%20%20PTALs%20Grid%20Values.zip",
]
notes = "Held until 2026-09-24, as not used in the first version. The founder approved the dataset that day, as it was passed to whoever wrote this entry, who did not hear it from the founder. How the licence was verified, on 2026-09-24, through a reader that extracts the text of a page: the page of the dataset was read four times in different words, and each reading that was asked gave the licence as 'Open Government Licence v2', linked to the second version of the licence on the National Archives' site. The licence was read once on its own page: it lets a person 'exploit the Information commercially and non-commercially', asks that the source be acknowledged 'by including any attribution statement specified by the Information Provider(s)', and gives the attribution above for a provider that states none. The page gives Transport for London as the author and a team of the Greater London Authority as the maintainer, and states no credit and no copyright line for the data. Is there a later edition than 2015: none was found. The page of the dataset holds nine files, a guide and eight files of 2015, says 'The 2015 files are available to download below' and 'Current PTAL values can be viewed on TfL's web site', and says it was last updated over nine years ago. Its field for the period reads January 2008 to December 2014 for every file, the guide among them, so it is taken to be of the record and not of the figures. TfL's open data page, read three times, says 'The available PTAL data is provided in three files, one for a recent base year and two others for future scenarios in 2021 and 2031', and names no year for the base. It sends the reader to WebCAT, which is now a map on another host and gave the reader no text. So what TfL gives today may be of 2015 too, or later: no page that was read says. Whatever it is, it is under the WebCAT terms. Those were read twice. Both readings gave 'Users are not permitted to change WebCAT outputs, or to present outputs of one query as if they were the outputs of a different query'. One gave that WebCAT is 'primarily intended for the use of specialised transport planners', and the other found the words licence, commercial, copy, publish, reproduce and redistribute nowhere on the page. The search of the Datastore could not be read: it answered that the page was gone. One file is named under file_urls, the grid: a zip of 8.59 MB that the page calls '2015 PTAL Grid Values.zip'. Two readings gave its address the same, letter for letter, with two spaces written as %20 between 2015 and PTALs. The page says the smallest geography is '100m Grid Squares'. The grid is taken because a point is placed in an output area of 2021 by where it stands. The other files give a mean for each area of the census of 2011 or of 2001, for wards and for boroughs, and an area of one census is never taken for an area of another. Nobody has opened the zip, so what it holds and how it names its columns is not known."

