attribution = "No fixed statement. Terms of Service clause 5.4: 'Customer shall display the TravelTime logo or name on the section or page of the Customer's Platform or Third Party Platform where Service Data is displayed'."
attribution_verified = false
conditions = [
    "The free plan cannot be used. Clause 12.5: trial and non-paid services 'are for internal use and evaluation only and are not to be made available to Customer's End Users'. 'No commercial use or profit-making purposes are permitted.'",
    "Production needs a quoted annual subscription with a 12 month minimum. No price is published.",
    "Clause 7.3: caching is allowed 'only where and to the extent expressly permitted by TravelTime in the Order'. Cached data must be refreshed 'at least every 60 days' and deleted 'upon termination or expiry of this Agreement'. TravelTime may ask for proof of deletion.",
    "The terms forbid creating derivative works based on the API or service, storing or displaying any part of it except as granted, and using it to develop a competing product. A stored travel-time matrix must be named in the Order.",
    "Deleting cached data on termination would remove every stored matrix, so shared links could not be reproduced. Adopt only with caching, retention and reuse rights written into the Order.",
    "To clear: a signed Order that names precomputed matrices, the cache refresh period, and display on a non-TravelTime map.",
]
status = "held"
status_reason = "Paid fallback only. Not used in v1 because the open-data R5 pipeline is the primary path, the free plan bans commercial use, and no Order exists."
verified_how = "primary_source"
verified_on = 2026-09-23
evidence_urls = [
    "https://traveltime.com/terms-of-service",
    "https://traveltime.com/pricing",
    "https://docs.traveltime.com/api/tiles/getting-started",
]

