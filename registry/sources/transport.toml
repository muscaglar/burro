notes = "On 2026-09-24 no page of data.bus-data.dft.gov.uk was read, so the three checks stand. Read that day, through a reader that extracts, twice in different words: three pages of the Department for Transport on GOV.UK, the last three addresses above. The guidance, last updated on 25 November 2020, says 'Bus open data is now available for use, and we encourage consumers to access this for commercial and non-commercial purposes', and names three ways to the data: to browse, to download and an API. The implementation guide says 'To register for an account, data consumers using the Find Bus Open Data Service will be required to supply an email address', and 'Data consumers must acknowledge the source of information in their product or application through a statement of attribution. Data should be attributed back to BODS'. It gives no wording for the statement. So an account is needed, and the credit is to the service and not only the default of the licence. The collection page says the duty to publish covers 'all local bus services across England (outside London)'. So whatever the service holds of London is there by another route, which is check 3. On TfL's forum a person who uses the data wrote on 2 September 2025 of 'the GTFS timetable published by BODS' as holding Tube services. That is a report by a user of the data and no page of the publisher's. If it is so, the London file holds more than buses, and check 2 says how to count it. None of this changes the status: the terms shown at sign-up and on the download page are not read."

