[project]
name = "burro-api"
version = "0.0.0"
description = "Burro's HTTP API: FastAPI over one data release held in memory. No database."
requires-python = ">=3.13"
dependencies = [
    "burro-core",
    # The web framework named in the plan. Held to one minor version: it is
    # still 0.x, and the OpenAPI document it writes is committed.
    "fastapi>=0.141,<0.142",
    # Runs the app. The plain package, without the `standard` extra and its native tools.
    "uvicorn>=0.30",
]

[project.scripts]
burro-api = "burro_api.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/burro_api"]
